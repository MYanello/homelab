---
- name: Configure AdGuard Home DNS bind addresses
  become: true
  vars:
    adguard_bind_addresses:
      - 127.0.0.1
      - 192.168.1.1
      - 192.168.3.1
      - 192.168.5.1
      - 192.168.6.1
      - 192.168.7.1
      - 192.168.10.1
      - 192.168.11.1
      - 192.168.20.1
      - 192.168.30.1
      - 192.168.99.1
      - 192.168.100.1
  ansible.builtin.replace:
    path: /usr/local/AdGuardHome/AdGuardHome.yaml
    regexp: '(?ms)^[ ]{0,2}bind_hosts:\n(?:[ ]{2,4}- [^\n]+\n)+'
    replace: "{{★'★★bind_hosts:\n★★★★-★'★~★(adguard_bind_addresses★|★join('\n★★★★-★'))★~★'\n\
      '★}}"
    backup: true
    validate: /usr/local/AdGuardHome/AdGuardHome --check-config --no-permcheck -c
      %s -w /usr/local/AdGuardHome
  register: adguard_bind_hosts
  notify:
    - Restart AdGuard Home

- name: Ensure AdGuard Home is running
  become: true
  ansible.builtin.service:
    name: adguardhome
    state: started
