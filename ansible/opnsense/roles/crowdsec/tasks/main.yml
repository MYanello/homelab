---
- name: Check whether the crowdsec plugin is installed
  ansible.builtin.command:
    cmd: pkg info -e os-crowdsec
  register: crowdsec_pkg
  changed_when: false
  failed_when: false

- name: Install the crowdsec plugin
  ansible.builtin.command:
    cmd: configctl firmware install os-crowdsec
  when: crowdsec_pkg.rc != 0
  changed_when: true

- name: Install the crowdsec plugin config
  ansible.builtin.copy:
    src: config.yaml
    dest: /usr/local/etc/crowdsec/config.yaml
    owner: root
    group: wheel
    mode: "0600"
  notify: Restart CrowdSec
