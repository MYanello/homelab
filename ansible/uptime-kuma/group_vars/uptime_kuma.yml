---
uptime_kuma_image: louislam/uptime-kuma
uptime_kuma_version: "2.5.8"
uptime_kuma_data_dir: /opt/uptime-kuma-data
uptime_kuma_host: "0.0.0.0"
uptime_kuma_port: 3001
uptime_kuma_pull: false
docker_user: ubuntu
swap_file: /swapfile
swap_size: 2G
swappiness: "10"
backup_enabled: true
backup_staging_dir: /var/lib/uptime-kuma-backup
backup_rclone_config: /etc/rclone/rclone.conf
backup_script: /usr/local/bin/uptime-kuma-backup.sh
b2_endpoint: https://s3.us-west-004.backblazeb2.com
b2_region: us-west-004
backup_remote: backblaze:myanello-backups/oracle-free
