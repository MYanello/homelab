---
- name: Write backup script
  ansible.builtin.template:
    src: uptime-kuma-backup.sh.j2
    dest: "{{ backup_script }}"
    owner: root
    group: root
    mode: "0700"

- name: Write backup service unit
  ansible.builtin.template:
    src: uptime-kuma-backup.service.j2
    dest: /etc/systemd/system/uptime-kuma-backup.service
    owner: root
    group: root
    mode: "0644"
  register: backup_service

- name: Write backup timer unit
  ansible.builtin.template:
    src: uptime-kuma-backup.timer.j2
    dest: /etc/systemd/system/uptime-kuma-backup.timer
    owner: root
    group: root
    mode: "0644"
  register: uptime_kuma_backup_timer

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: backup_service.changed or uptime_kuma_backup_timer.changed

- name: Enable backup timer
  ansible.builtin.systemd_service:
    name: uptime-kuma-backup.timer
    enabled: true
    state: started
