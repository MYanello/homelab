---
- name: Validate wireguard gateway configuration
  ansible.builtin.assert:
    that:
      - wireguard_gateway_private_key is defined
      - wireguard_gateway_private_key | length > 0
    fail_msg: >-
      wireguard_gateway_private_key must be set in
      group_vars/uptime_kuma.sops.yaml
    quiet: true

- name: Install wireguard tools
  ansible.builtin.apt:
    name:
      - wireguard-tools
    state: present
    update_cache: true

- name: Ensure IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-wireguard-gateway.conf
    sysctl_set: true
    state: present
    reload: true

- name: Ensure wireguard configuration directory
  ansible.builtin.file:
    path: "{{ wireguard_gateway_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write wireguard gateway configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "{{ wireguard_gateway_config_path }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart wireguard gateway

- name: Enable and start wireguard gateway
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wireguard_gateway_interface }}"
    enabled: true
    state: started
    daemon_reload: true

# The FORWARD policy is DROP with a trailing REJECT, so these have to be
# inserted before it (and before Docker's chains).
- name: Allow forwarding from the VCN into the wireguard tunnel
  ansible.builtin.iptables:
    chain: FORWARD
    source: "{{ item }}"
    out_interface: "{{ wireguard_gateway_interface }}"
    jump: ACCEPT
    action: insert
    rule_num: 1
  loop: "{{ wireguard_gateway_forwarded_cidrs }}"
  register: uptime_kuma_wireguard_forward_vcn

- name: Retire the conntrack-restricted return rule
  ansible.builtin.iptables:
    chain: FORWARD
    in_interface: "{{ wireguard_gateway_interface }}"
    destination: "{{ wireguard_gateway_source_cidr }}"
    ctstate:
      - ESTABLISHED
      - RELATED
    jump: ACCEPT
    state: absent
  register: uptime_kuma_wireguard_forward_return_absent

- name: Allow forwarding from the wireguard tunnel into the VCN
  ansible.builtin.iptables:
    chain: FORWARD
    in_interface: "{{ wireguard_gateway_interface }}"
    destination: "{{ item }}"
    jump: ACCEPT
    action: insert
    rule_num: 1
  loop: "{{ wireguard_gateway_forwarded_cidrs }}"
  register: uptime_kuma_wireguard_forward_vcn_in

- name: Retire masquerading towards the home network
  ansible.builtin.iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ wireguard_gateway_source_cidr }}"
    out_interface: "{{ wireguard_gateway_interface }}"
    jump: MASQUERADE
    state: absent
  register: uptime_kuma_wireguard_nat_absent

- name: Persist wireguard gateway firewall rules
  ansible.builtin.command:
    cmd: netfilter-persistent save
  changed_when: false
  when: >-
    uptime_kuma_wireguard_forward_vcn.changed or
    uptime_kuma_wireguard_forward_return_absent.changed or
    uptime_kuma_wireguard_forward_vcn_in.changed or
    uptime_kuma_wireguard_nat_absent.changed

- name: Write wireguard gateway endpoint refresh script
  ansible.builtin.template:
    src: wireguard-gateway-endpoint.sh.j2
    dest: "{{ wireguard_gateway_endpoint_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Write wireguard gateway endpoint refresh service
  ansible.builtin.template:
    src: wireguard-gateway-endpoint.service.j2
    dest: /etc/systemd/system/wireguard-gateway-endpoint.service
    owner: root
    group: root
    mode: "0644"
  register: uptime_kuma_wireguard_endpoint_service

- name: Write wireguard gateway endpoint refresh timer
  ansible.builtin.template:
    src: wireguard-gateway-endpoint.timer.j2
    dest: /etc/systemd/system/wireguard-gateway-endpoint.timer
    owner: root
    group: root
    mode: "0644"
  register: uptime_kuma_wireguard_endpoint_timer

- name: Reload systemd for wireguard gateway endpoint refresh
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: >-
    uptime_kuma_wireguard_endpoint_service.changed or
    uptime_kuma_wireguard_endpoint_timer.changed

- name: Enable and start wireguard gateway endpoint refresh timer
  ansible.builtin.systemd_service:
    name: wireguard-gateway-endpoint.timer
    enabled: true
    state: started
