---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3
      - python3-apt
      - acl
    state: present
    update_cache: true

- name: Remove unattended upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
    state: absent
    purge: true
    autoremove: true

- name: Disable oracle cloud agent
  ansible.builtin.import_tasks: oci-agent.yml

- name: Install docker
  ansible.builtin.apt:
    name:
      - docker.io
    state: present
    update_cache: true

- name: Enable docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true

- name: Configure swap
  ansible.builtin.import_tasks: swap.yml

- name: Ensure uptime kuma data directory
  ansible.builtin.file:
    path: "{{ uptime_kuma_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Pull uptime kuma image
  community.docker.docker_image:
    name: "{{ uptime_kuma_image }}"
    tag: "{{ uptime_kuma_version }}"
    source: pull
    force_source: "{{ uptime_kuma_pull }}"
  register: uptime_kuma_pull_result

- name: Run uptime kuma
  community.docker.docker_container:
    name: uptime-kuma
    image: "{{ uptime_kuma_image }}:{{ uptime_kuma_version }}"
    state: started
    restart_policy: unless-stopped
    detach: true
    pull: false
    published_ports:
      - "{{ uptime_kuma_port }}:3001"
    volumes:
      - "{{ uptime_kuma_data_dir }}:/app/data"
    env:
      UPTIME_KUMA_HOST: "{{ uptime_kuma_host }}"
      UPTIME_KUMA_PORT: "3001"
    comparisons:
      image: strict
  register: uptime_kuma_container

- name: Wait for uptime kuma to listen
  ansible.builtin.wait_for:
    host: "{{ uptime_kuma_host }}"
    port: "{{ uptime_kuma_port }}"
    timeout: 120

- name: Check for existing uptime kuma firewall rule
  ansible.builtin.shell:
    cmd: iptables -C INPUT -p tcp --dport {{ uptime_kuma_port }} -m state --state
      NEW -j ACCEPT
  register: uptime_kuma_fw_check
  changed_when: false
  failed_when: false

- name: Allow uptime kuma through host firewall
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_ports:
      - "{{ uptime_kuma_port }}"
    ctstate:
      - NEW
    jump: ACCEPT
    action: append
  when: uptime_kuma_fw_check.rc != 0
  register: uptime_kuma_firewall

- name: Persist host firewall rules
  ansible.builtin.command:
    cmd: netfilter-persistent save
  when: uptime_kuma_firewall.changed

- name: Configure backups
  ansible.builtin.import_tasks: backup.yml
  when: backup_enabled | bool
