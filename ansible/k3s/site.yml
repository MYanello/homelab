---
- name: Configure Raspberry Pi cgroup settings
  hosts: raspberry_pi
  become: true
  tasks:
    - name: Enable cgroups in boot parameters
      ansible.builtin.lineinfile:
        path: /boot/firmware/cmdline.txt
        backrefs: true
        regexp: '^((?!.*\bcgroup_memory=1 cgroup_enable=memory\b).*)$'
        line: '\1 cgroup_memory=1 cgroup_enable=memory'
      register: cmdline
    - name: Reboot if boot parameters were changed
      ansible.builtin.reboot: null
      when: cmdline.changed

- name: Bootstrap the first k3s server
  hosts: k3s_bootstrap
  become: true
  vars:
    k3s_cluster_init: true
  roles:
    - k3s_control_plane
  post_tasks:
    - name: Read the cluster join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/token
      register: k3s_token_file

    - name: Publish the join token to the rest of the cluster
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_file.content | b64decode | trim }}"

    - name: Hand the join token to the remaining servers and agents
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: >-
        {{ groups['k3s_control_plane'] | difference(groups['k3s_bootstrap'])
           + groups['k3s_agents'] }}

    - name: Wait for the first server to come up
      ansible.builtin.pause:
        seconds: 10
      when: (groups['k3s_control_plane'] | length) > 1

- name: Join the remaining k3s control plane servers
  hosts: k3s_control_plane:!k3s_bootstrap
  become: true
  vars:
    k3s_cluster_init: false
  roles:
    - k3s_control_plane

- name: Wait for all control plane nodes to register
  hosts: k3s_control_plane
  become: true
  vars:
    total_amount_of_nodes: "{{ groups['k3s_control_plane'] | count }}"
  tasks:
    - name: Wait until all control plane nodes are registered
      ansible.builtin.shell: |
        k3s kubectl get nodes --no-headers | wc -l
      register: agents
      until: agents.stdout | int == total_amount_of_nodes | int
      retries: 10
      delay: 10

- name: Install k3s agents
  hosts: k3s_agents
  become: true
  roles:
    - k3s_agent
