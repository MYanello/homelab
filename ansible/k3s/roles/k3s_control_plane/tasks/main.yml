---
- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download the k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: "{{ k3s_install_script_dest }}"
    mode: "0755"
  when: not k3s_binary.stat.exists

- name: Write the kubelet config
  ansible.builtin.template:
    src: kubelet.config.j2
    dest: "{{ k3s_kubelet_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Write /etc/rancher/k3s/config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Install k3s server
  ansible.builtin.command: "{{ k3s_install_script_dest }}"
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_NODE_NAME: "{{ inventory_hostname }}"
    K3S_TOKEN: "{{ k3s_token | default('') }}"
    K3S_URL: "{{ ('https://' ~ k3s_control_plane_vip ~ ':6443') if not (k3s_cluster_init | bool) else '' }}"
    INSTALL_K3S_EXEC: "{{ k3s_server_exec_init if (k3s_cluster_init | bool) else k3s_server_exec_join }}"
  when: not k3s_binary.stat.exists or (reinstall | bool)
