[defaults]
collections_path = ./collections
inventory = ./inventory.ini
vars_plugins_enabled = host_group_vars, community.sops.sops

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey -o ControlPath=/tmp/ansible-ssh-%h-%p-%r
