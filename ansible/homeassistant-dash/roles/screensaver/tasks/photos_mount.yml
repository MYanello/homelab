---
- name: Install nfs-common
  ansible.builtin.apt:
    name:
      - nfs-common
    state: present
    update_cache: false

- name: Create Marcus mountpoint
  ansible.builtin.file:
    path: "{{ marcus_mount_path }}"
    state: directory
    mode: "0755"

- name: Mount the Marcus share and persist it in fstab
  ansible.posix.mount:
    path: "{{ marcus_mount_path }}"
    src: "{{ truenas_mount_server }}:{{ marcus_mount_export }}"
    fstype: nfs
    opts: "{{ truenas_mount_opts }}"
    state: mounted
  notify: reload systemd units

- name: Create Camille mountpoint
  ansible.builtin.file:
    path: "{{ camille_mount_path }}"
    state: directory
    mode: "0755"

- name: Mount the Camille share and persist it in fstab
  ansible.posix.mount:
    path: "{{ camille_mount_path }}"
    src: "{{ truenas_mount_server }}:{{ camille_mount_export }}"
    fstype: nfs
    opts: "{{ truenas_mount_opts }}"
    state: mounted
  notify: reload systemd units
