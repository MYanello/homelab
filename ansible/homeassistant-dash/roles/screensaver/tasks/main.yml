---
- name: Install python3-gi
  ansible.builtin.apt:
    name:
      - python3-gi
    state: present
    update_cache: true

- name: Install the screensaver
  ansible.builtin.copy:
    src: screensaver.py
    dest: /usr/local/bin/screensaver.py
    owner: root
    group: root
    mode: "0755"

- name: Ensure autostart directory exists
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.config/autostart
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Autostart the screensaver in the session
  ansible.builtin.template:
    src: screensaver.desktop.j2
    dest: /home/{{ ansible_user }}/.config/autostart/screensaver.desktop
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Disable GNOME blanking and locking so the photo screensaver controls the
    screen
  ansible.builtin.import_tasks: gnome_settings.yml

- name: Mount shared photo dir
  ansible.builtin.import_tasks: photos.yml
