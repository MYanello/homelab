---
- name: Initialize the USB device (destroys existing data)
  when: wipe_usb | bool
  block:
    - name: Un-mount {{ usb_dev }}1 from {{ mountpount }} before wiping
      ansible.posix.mount:
        path: "{{ mountpount }}"
        src: "{{ usb_dev }}1"
        fstype: ext4
        state: unmounted

    - name: Read device information (always use unit when probing)
      community.general.parted:
        device: "{{ usb_dev }}"
        unit: MiB
      register: dev_info
      ignore_errors: true

    - name: Remove all partitions from disk
      community.general.parted:
        device: "{{ usb_dev }}"
        number: "{{ item.num }}"
        state: absent
      loop: "{{ dev_info.partitions | default([]) }}"

    - name: Create a new ext4 primary partition
      community.general.parted:
        device: "{{ usb_dev }}"
        number: 1
        state: present
        fs_type: ext4

    - name: Create a ext4 filesystem on {{ usb_dev }}1 and check disk blocks
      filesystem:
        fstype: ext4
        dev: "{{ usb_dev }}1"

- name: Create the mountpoint
  file:
    path: "{{ mountpount }}"
    state: directory
    recurse: true
    owner: root
    group: root
    mode: "0755"

- name: Get the uuid
  command: blkid -s UUID -o value {{ usb_dev }}1
  register: uuid
  changed_when: false

- name: Mount the device onto "{{ mountpount }}"
  ansible.posix.mount:
    path: "{{ mountpount }}"
    src: "UUID={{ uuid.stdout }}"
    fstype: ext4
    state: mounted
