---
# .github/workflows/generate-diff.yml
name: Argo CD Diff Preview

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: pull-request

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: main
      - name: Write Harbor Repo Secret
        env:
          HARBOR_ROBOT_PASSWORD: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
        run: |
          mkdir -p secrets
          cat > secrets/harbor-repo.yaml <<-EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: harbor-helm-repo
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repository
          stringData:
            type: helm
            name: harbor
            url: harbor.yanello.net/helm
            enableOCI: "true"
            username: robot-argo-diff-preview
            password: "${HARBOR_ROBOT_PASSWORD}"
          EOF

      - name: Preinstall Redis Secret
        run: |
          mkdir -p preinstall
          cat > preinstall/argocd-redis.yaml <<-EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: argocd-redis
            namespace: argocd
          stringData:
            auth: ci-password
          EOF

      - name: Set Argo CD Custom Values
        run: |
          cat > values.yaml <<-'EOF'
          configs:
            cm:
              kustomize.buildOptions: --enable-helm
          redis:
            image:
              repository: harbor.yanello.net/docker/library/redis
              tag: 8.6.4-alpine
            existingSecret: argocd-redis
          redisSecretInit:
            enabled: false
          EOF
      - name: Generate Diff
        run: |
          docker run \
            --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/main:/base-branch \
            -v $(pwd)/pull-request:/target-branch \
            -v $(pwd)/output:/output \
            -v $(pwd)/secrets:/secrets \
            -v $(pwd)/preinstall:/preinstall \
            -v $(pwd)/values.yaml:/argocd-config/values.yaml \
            -e TARGET_BRANCH=${{ github.head_ref }} \
            -e REPO=${{ github.repository }} \
            dagandersen/argocd-diff-preview:v0.2.17@sha256:ea90848df29337b50d5058330210b38e39232360b78d9c60951fc92e454c6941 \
            --diff-ignore="checksum|caBundle" \
            --debug

      - name: Post diff as comment
        run: |
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md --edit-last || \
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
