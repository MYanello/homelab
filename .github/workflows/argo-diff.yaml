---
# .github/workflows/generate-diff.yml
name: Argo CD Diff Preview

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: pull-request

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: main
      - name: Write SOPS Secret
        run: |
          mkdir -p secrets
          SOPS_KEY=$(echo "${{ secrets.SOPS_KEY }}" | base64 -w 0)
          cat > secrets/secret-sops.yaml <<-EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: sops-age
            namespace: argocd
          data:
            key.txt: "${SOPS_KEY}"
          EOF

      - name: Set Argo CD Custom Values
        run: |
          cat > values.yaml <<-EOF
          configs:
            cm:
              kustomize.buildOptions: --enable-helm --enable-alpha-plugins --enable-exec
          repoServer:
            env:
              - name: SOPS_AGE_KEY_FILE
                value: /.config/sops/age/key.txt
            volumes:
              - name: custom-tools
                emptyDir: {}
              - name: sops-age
                secret:
                  secretName: sops-age
            initContainers:
              - name: install-ksops
                image: viaductoss/ksops:v4.5.1@sha256:4def9fdd4e2f850265740ebe9592c5455d19b76891e88e602df8b52d74b95334
                command: ["/bin/sh", "-c"]
                args:
                  - echo "Installing KSOPS...";
                    mv ksops /custom-tools/;
                    mv kustomize /custom-tools/;
                    echo "Done.";
                volumeMounts:
                  - mountPath: /custom-tools
                    name: custom-tools
            volumeMounts:
              - mountPath: /usr/local/bin/ksops
                name: custom-tools
                subPath: ksops
              - mountPath: /.config/sops/age/key.txt
                name: sops-age
                subPath: key.txt
          EOF

      - name: Generate Diff
        run: |
          docker run \
            --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/main:/base-branch \
            -v $(pwd)/pull-request:/target-branch \
            -v $(pwd)/output:/output \
            -v $(pwd)/secrets:/secrets \
            -v $(pwd)/values.yaml:/argocd-config/values.yaml \
            -e TARGET_BRANCH=${{ github.head_ref }} \
            -e REPO=${{ github.repository }} \
            dagandersen/argocd-diff-preview:v0.2.15@sha256:01c4712f945f9183ef1eacbaf5974ced42624b8bdfc6dab876a07ab89bd0cd83 \
            --diff-ignore="checksum|caBundle"

      - name: Post diff as comment
        run: |
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md --edit-last || \
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
