---
repos:
  - repo: https://github.com/lyz-code/yamlfix/
    rev: 1.19.1
    hooks:
      - id: yamlfix
        exclude: charts/
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [--strict, -c=.yamllint]
  - repo: local
    hooks:
      - id: sanitize-grafana-dashboards
        name: sanitize grafana dashboards
        entry: uv run utils/scripts/sanitize-grafana-dashboards.py
        language: system
        files: ^argocd/infra/monitoring/dashboards/.*\.json$
