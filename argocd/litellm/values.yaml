---
replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 512Mi
  limits:
    memory: 2Gi
masterkeySecretName: vault-secrets
masterkeySecretKey: PROXY_MASTER_KEY

environmentSecrets:
  - vault-secrets

envVars:
  PROXY_BASE_URL: https://llm.yanello.net
  PROXY_ADMIN_ID: e95de16d00fdf34bef87a53906c3d77e603ac08f1dbe42735451d36a673f0131
  GENERIC_CLIENT_ID: WKvSFMamJfufOsIv8KmuoyUBhvihplxuOEaP5Zsu
  GENERIC_AUTHORIZATION_ENDPOINT: https://authentik.yanello.net/application/o/authorize/
  GENERIC_TOKEN_ENDPOINT: https://authentik.yanello.net/application/o/token/
  GENERIC_USERINFO_ENDPOINT: https://authentik.yanello.net/application/o/userinfo/
  GENERIC_SCOPE: openid profile email
  GENERIC_USER_ID_ATTRIBUTE: sub
  # OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry-collector.monitoring.svc.cluster.local:4318
  # OTEL_EXPORTER_OTLP_PROTOCOL: http/json
  # OTEL_SERVICE_NAME: litellm
  # OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: EVENT_ONLY
  # LITELLM_OTEL_INTEGRATION_ENABLE_EVENTS: "true"

proxy_config:
  model_list:
    - model_name: inference/latest
      litellm_params:
        model: custom_openai/sglang/latest
        api_base: https://sglang.cw623e-myanello.coreweave.app/v1
        api_key: os.environ/HOSTED_API_KEY
    - model_name: "openrouter/*"
      litellm_params:
        model: "openrouter/*"
        api_key: os.environ/OPENROUTER_API_KEY
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    store_model_in_db: true
    disable_env_credential_login: true
    disable_password_login_when_sso_enabled: true
  # litellm_settings:
    # callbacks:
      # - otel

db:
  deployStandalone: false
  useExisting: true
  endpoint: litellm-db-rw
  database: litellm
  secret:
    name: litellm-db-app
    usernameKey: username
    passwordKey: password
  connectionPool:
    enabled: true

redis:
  enabled: true
  auth:
    existingSecret: vault-secrets
    existingSecretPasswordKey: REDIS_PASSWORD
  master:
    persistence:
      enabled: true
      storageClass: truenas-ssd
      size: 2Gi
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

migrationJob:
  hooks:
    argocd:
      enabled: true

metricsServer:
  enabled: true
serviceMonitor:
  enabled: false
