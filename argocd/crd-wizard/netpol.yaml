---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crd-wizard
spec:
  endpointSelector:
    matchLabels:
      app: crd-wizard
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toCIDR:
        - 192.168.10.44/32
        - 192.168.10.55/32
        - 192.168.10.66/32
        - 192.168.10.100/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
