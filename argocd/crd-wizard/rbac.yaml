---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crd-wizard-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crd-wizard-role
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crd-wizard-binding
subjects:
  - kind: ServiceAccount
    name: crd-wizard-sa
    namespace: crd-wizard
roleRef:
  kind: ClusterRole
  name: crd-wizard-role
  apiGroup: rbac.authorization.k8s.io
