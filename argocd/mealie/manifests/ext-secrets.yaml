---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: mealie-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: mealie/mealie-secrets
