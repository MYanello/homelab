---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airtrail-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: airtrail-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: airtrail/airtrail-secrets
