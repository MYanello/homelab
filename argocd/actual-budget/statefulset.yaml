---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: actual-budget
spec:
  replicas: 1
  selector:
    matchLabels:
      app: actual-budget
  serviceName: actual-budget
  template:
    metadata:
      labels:
        app: actual-budget
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      containers:
        - name: actual-budget
          image: harbor.yanello.net/ghcr/actualbudget/actual-server:26.11.0@sha256:06cf186569cf58d93e12659ff1a517b65b5b0ebee7050a3991d4bd8a1d398da6
          ports:
            - containerPort: 5006
              protocol: TCP
          env:
            - name: ACTUAL_OPENID_DISCOVERY_URL
              value: "https://authentik.yanello.net/application/o/actual-budget/"
            - name: ACTUAL_OPENID_SERVER_HOSTNAME
              value: "https://actual.yanello.net"
            - name: ACTUAL_OPENID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: actual-budget-secrets
                  key: ACTUAL_OPENID_CLIENT_ID
            - name: ACTUAL_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: actual-budget-secrets
                  key: ACTUAL_OPENID_CLIENT_SECRET
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: truenas-ssd
        resources:
          requests:
            storage: 2Gi
