---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-budget-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: actual-budget-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: actual-budget/actual-budget-secrets
