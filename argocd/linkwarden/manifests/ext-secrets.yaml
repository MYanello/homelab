---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: linkwarden-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: linkwarden/linkwarden-secrets
