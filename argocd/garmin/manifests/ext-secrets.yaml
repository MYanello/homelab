---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garmin-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: garmin-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: garmin/garmin-secrets
