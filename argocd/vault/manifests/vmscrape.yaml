---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMScrapeConfig
metadata:
  name: vault
spec:
  scrape_interval: 60s
  staticConfigs:
    - targets:
        - vault.yanello.net
  path: /v1/sys/metrics
  params:
    format:
      - prometheus
  relabelConfigs:
    - targetLabel: job
      replacement: vault
  scheme: https
