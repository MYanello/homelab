---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Vault
    gethomepage.dev/icon: sh-hashicorp-vault
    gethomepage.dev/description: "Vault provides organizations with identity-based\
      \ security to automatically authenticate and authorize access to secrets and\
      \ other sensitive data."
    gethomepage.dev/pod-selector: app.kubernetes.io/name=vault
  labels:
    app.kubernetes.io/instance: vault-app
  name: vault-route
spec:
  parentRefs:
    - name: vault-private-tls-gateway
      namespace: cilium
      sectionName: vault-tls-passthrough
  hostnames:
    - vault.yanello.net
  rules:
    - backendRefs:
        - name: vault-service
          port: 8200
---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8200
      targetPort: 8200
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: vault-service-1
  labels:
    kubernetes.io/service-name: vault-service
    endpointslice.kubernetes.io/managed-by: cluster-admin
addressType: IPv4
ports:
  - name: http
    appProtocol: http
    protocol: TCP
    port: 8200
endpoints:
  - addresses:
      - 192.168.10.5
    conditions:
      ready: true
