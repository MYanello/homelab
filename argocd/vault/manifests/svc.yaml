---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: vault
  annotations:
    io.cilium/lb-ipam-ips: 10.10.8.103
    external-dns.kubernetes.io/hostname: vault.yanello.net
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Vault
    gethomepage.dev/icon: sh-hashicorp-vault
    gethomepage.dev/description: "Vault provides organizations with identity-based\
      \ security to automatically authenticate and authorize access to secrets and\
      \ other sensitive data."
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 166.19.10.192/26
    - 166.19.19.0/24
    - 192.168.1.0/24
    - 192.168.10.0/24
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8200
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: vault-service-1
  namespace: vault
  labels:
    kubernetes.io/service-name: vault-service
    endpointslice.kubernetes.io/managed-by: cluster-admin
addressType: IPv4
ports:
  - name: https
    appProtocol: https
    protocol: TCP
    port: 8200
endpoints:
  - addresses:
      - 192.168.10.5
    conditions:
      ready: true
