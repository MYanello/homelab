---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
spec:
  ports:
    - name: https
      protocol: TCP
      port: 8200
      targetPort: 8200
      appProtocol: https
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: vault-service-1
  labels:
    kubernetes.io/service-name: vault-service
    endpointslice.kubernetes.io/managed-by: cluster-admin
addressType: IPv4
ports:
  - name: https
    appProtocol: https
    protocol: TCP
    port: 8200
endpoints:
  - addresses:
      - 192.168.10.5
    conditions:
      ready: true
