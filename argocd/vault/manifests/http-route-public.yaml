---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-cks-route
  annotations:
    external-dns.kubernetes.io/controller: ignore
spec:
  parentRefs:
    - name: cilium-public-gateway
      namespace: cilium
      sectionName: https
  hostnames:
    - vault.yanello.net
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/auth/cks/login
        - path:
            type: PathPrefix
            value: /v1/cks-k8s-kv/data/
        - path:
            type: Exact
            value: /v1/auth/token/lookup-self
        - path:
            type: Exact
            value: /v1/auth/token/renew-self
        - path:
            type: Exact
            value: /v1/auth/token/revoke-self
      backendRefs:
        - name: vault-service
          port: 8200
