---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: excalidash-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: excalidash-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: excalidash/excalidash-secrets
