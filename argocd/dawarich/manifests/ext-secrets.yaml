---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dawarich-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: dawarich-db-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dawarich/dawarich-db-credentials
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dawarich-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: dawarich-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dawarich/dawarich-secrets
