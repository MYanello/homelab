---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: resume-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: resume-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: resume/resume-secrets
