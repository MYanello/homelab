---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rx-resume
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: rx-resume
  template:
    metadata:
      labels:
        app: rx-resume
    spec:
      containers:
        - name: rx-resume
          image: harbor.yanello.net/ghcr/amruthpillai/reactive-resume:v5.3.0@sha256:c487ec5edcfe054bcb312fcd498f868e56f274756d0046b01c83f210855017ab
          ports:
            - containerPort: 3010
          env:
            - name: APP_URL
              value: https://resume.yanello.net
            - name: PORT
              value: "3010"
            - name: PUBLIC_URL
              value: "https://resume.yanello.net"
            - name: PRINTER_ENDPOINT
              value: "http://$(PRINTER_SERVICE_HOST):$(PRINTER_SERVICE_PORT)"
            - name: PRINTER_APP_URL
              value: http://rx-resume:3010
            - name: FLAG_DISABLE_SIGNUPS
              value: "false"
            - name: FLAG_DEBUG_PRINT
              value: "true"
            - name: FLAG_DISABLE_EMAIL_AUTH
              value: "true"
            - name: STORAGE_ENDPOINT
              value: "s3.us-west-004.backblazeb2.com"
            - name: STORAGE_REGION
              value: "us-west-004"
            - name: STORAGE_BUCKET
              value: "myanello-rxresume"
            - name: STORAGE_USE_SSL
              value: "true"
            - name: SKIP_BUCKET_CHECK
              value: "false"
            - name: STORAGE_PORT
              value: "443"
            - name: STORAGE_URL
              value: "https://s3.us-west-004.backblazeb2.com/myanello-rxresume"
            - name: OAUTH_PROVIDER_NAME
              value: Authentik
            - name: OAUTH_DISCOVERY_URL
              value: https://authentik.yanello.net/application/o/rxr/.well-known/openid-configuration
            - name: AI_ALLOWED_BASE_URLS
              value: https://llm.yanello.net
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
          envFrom:
            - secretRef:
                name: resume-secrets
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: printer
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: printer
  template:
    metadata:
      labels:
        app: printer
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      containers:
        - name: printer
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 96Mi
          image: harbor.yanello.net/docker/chromedp/headless-shell:160.0.8171.0@sha256:dfc14efc6e4593fd997ce566bb2e3aa547cac43b03d978310ae1c61eb0e81032
          ports:
            - containerPort: 9222
