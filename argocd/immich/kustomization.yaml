---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./manifests/ext-secrets.yaml
  - ./manifests/netpol.yaml
  - manifests/deploy.yaml
  - manifests/service.yaml
  - manifests/http-route.yaml
  - manifests/sts.yaml
  - manifests/pvc.yaml
  - manifests/cm.yaml
  - ./manifests/cronjob.yaml

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: StatefulSet
