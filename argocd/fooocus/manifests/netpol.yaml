---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fooocus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: fooocus
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "7865"
              protocol: TCP
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
