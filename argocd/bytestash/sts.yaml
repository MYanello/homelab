---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bytestash
  labels:
    app: bytestash
spec:
  replicas: 1
  serviceName: bytestash
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: bytestash
  template:
    metadata:
      labels:
        app: bytestash
      annotations:
        backup.velero.io/backup-volumes: snip
    spec:
      containers:
        - name: bytestash
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: ALLOW_NEW_ACCOUNTS
              value: "true"
            - name: DEBUG
              value: "false"
            - name: DISABLE_ACCOUNTS
              value: "false"
            - name: DISABLE_INTERNAL_ACCOUNTS
              value: "false"
            - name: ALLOW_PASSWORD_CHANGES
              value: "true"
            - name: BASE_PATH
              value: ""
            - name: TOKEN_EXPIRY
              value: 24h
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_DISPLAY_NAME
              value: "Authentik"
            - name: OIDC_ISSUER_URL
              value: "https://authentik.yanello.net/application/o/bytestash/"
            - name: OIDC_SCOPES
              value: "openid profile email"
          envFrom:
            - secretRef:
                name: bytestash-secrets
          image: harbor.yanello.net/ghcr/jordan-dalby/bytestash:1.6.2@sha256:86d5726ef9a417775cc05120eed04c36915cbc41aea83c5799fc6b8d3ad77db5
          volumeMounts:
            - mountPath: /data/snippets
              name: snip
          resources:
            requests:
              cpu: 10m
              memory: 500Mi
            limits:
              memory: 640Mi
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: snip
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: truenas-ssd
        resources:
          requests:
            storage: 5Gi
