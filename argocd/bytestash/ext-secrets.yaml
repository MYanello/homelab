---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bytestash-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: bytestash-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: bytestash/bytestash-secrets
