---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: epic-games-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: epic-games-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: epic-games/epic-games-config
