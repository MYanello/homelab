---
rbac:
  additionalPermissions:
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get", "watch", "list"]
    - apiGroups: ["gateway.networking.k8s.io"]
      resources:
        - "gateways"
        - "httproutes"
        - "grpcroutes"
        - "tlsroutes"
        - "tcproutes"
        - "udproutes"
      verbs: ["get", "watch", "list"]

sources:
  - gateway-httproute
  - gateway-grpcroute
  - gateway-tlsroute
  - service
  - crd
# gatewayNamespace: cilium

extraArgs:
  - --gateway-label-filter=external-dns.yanello.net/gateway=private
policy: sync
registry: crd
txtOwnerId: agh

domainFilters:
  - yanello.net

provider:
  name: webhook
  webhook:
    image:
      repository: harbor.yanello.net/ghcr/muhlba91/external-dns-provider-adguard
      tag: v11.2.1@sha256:34efadcc9d16f8baad471d26b7caba2bd9466e230d434ffff822b574fda87753
    service:
      port: 8888
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 10
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 10
      timeoutSeconds: 5
    env:
      - name: ADGUARD_URL
        valueFrom:
          secretKeyRef:
            name: provider-secrets
            key: adguardURL
      - name: ADGUARD_USER
        valueFrom:
          secretKeyRef:
            name: provider-secrets
            key: adguardUser
      - name: ADGUARD_PASSWORD
        valueFrom:
          secretKeyRef:
            name: provider-secrets
            key: adguardPassword
      - name: LOG_LEVEL
        value: info
      - name: DRY_RUN
        value: "false"

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

affinity:
  preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      preference:
        matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
resources:
  requests:
    memory: 50Mi
    cpu: 10m
  limits:
    memory: 100Mi
