---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: provider-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: provider-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: external-dns-agh/provider-secrets
