---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./manifests/cluster-secret-store.yaml

generators:
  - ./manifests/secret-generator.yaml

helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: "2.11.0"
    releaseName: external-secrets
    namespace: external-secrets
    valuesInline:
      installCRDs: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Equal
          value: "true"
          effect: NoSchedule
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 96Mi
      certController:
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Equal
            value: "true"
            effect: NoSchedule
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 250Mi
      webhook:
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Equal
            value: "true"
            effect: NoSchedule
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 64Mi
