---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler
spec:
  provider:
    doppler:
      project: homelab
      config: prd
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token
            namespace: external-secrets
            key: dopplerToken
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: "https://vault.yanello.net"
      path: "k8s-kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "esops"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
