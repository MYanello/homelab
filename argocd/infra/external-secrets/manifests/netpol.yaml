---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets
  ingress: []
  egress:
    - toCIDR:
        - 192.168.10.44/32
        - 192.168.10.55/32
        - 192.168.10.66/32
        - 192.168.10.100/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: external-secrets
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
