---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-server-sso
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: argo-server-sso
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: argo-workflows/argo-server-sso
