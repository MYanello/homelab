---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: renovate-harbor
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: renovate/renovate-harbor
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: renovate-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: renovate/renovate-secrets
