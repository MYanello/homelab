---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - netpol.yaml
  - http-route.yaml

helmCharts:
  - name: argo-rollouts
    namespace: argo-rollouts
    releaseName: argo-rollouts
    repo: https://argoproj.github.io/argo-helm
    version: "2.43.6"
    valuesInline:
      installCRDs: true
      controller:
        image:
          registry: harbor.yanello.net/quay
          repository: argoproj/argo-rollouts
          tag: "v1.9.1"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
      dashboard:
        enabled: true
        readonly: false
        image:
          registry: harbor.yanello.net/quay
          repository: argoproj/kubectl-argo-rollouts
          tag: "v1.9.1"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
