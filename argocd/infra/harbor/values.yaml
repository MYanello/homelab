---
database:
  podAnnotations:
    backup.velero.io/backup-volumes: database
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 128Mi
redis:
  podAnnotations:
    backup.velero.io/backup-volumes: data
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 16Mi
existingSecretAdminPassword: harbor-secrets

updateStrategy:
  type: Recreate
  rollingUpdate: null

expose:
  tls:
    enabled: false
  type: route
  route:
    hosts:
      - harbor.yanello.net
    parentRefs:
      - name: cilium-private-gateway
        group: gateway.networking.k8s.io
        kind: Gateway
        namespace: cilium
        sectionName: https
      - name: cilium-public-gateway
        group: gateway.networking.k8s.io
        kind: Gateway
        namespace: cilium
        sectionName: https
externalURL: https://harbor.yanello.net

persistence:
  persistentVolumeClaim:
    registry:
      storageClass: truenas-hdd
      size: 500Gi
    chartmuseum:
      storageClass: truenas-hdd
    jobservice:
      jobLog:
        storageClass: truenas-hdd-nfs
        accessMode: ReadWriteMany
    database:
      storageClass: truenas-ssd
    redis:
      storageClass: truenas-ssd
    trivy:
      storageClass: truenas-hdd

cache:
  enabled: true

portal:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 16Mi
core:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      memory: 1Gi
jobservice:
  annotations:
    backup.velero.io/backup-volumes: harbor-jobservice
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi
registry:
  annotations:
    backup.velero.io/backup-volumes: harbor-registry
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 16Mi
exporter:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
