---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: harbor
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: harbor
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: harbor
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cilium
            k8s-app: cilium-envoy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "5000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: harbor
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
