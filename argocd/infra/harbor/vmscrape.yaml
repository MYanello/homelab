---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: harbor
  labels:
    app.kubernetes.io/name: harbor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/instance: harbor
  namespaceSelector:
    matchNames:
      - harbor
  endpoints:
    - port: http-metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
