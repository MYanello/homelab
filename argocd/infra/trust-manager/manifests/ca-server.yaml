---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ca-server
  name: ca-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ca-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ca-server
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ca-server
          image: harbor.yanello.net/docker/nginx/nginx-unprivileged:1.30
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 10Mi
            limits:
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: ca
              mountPath: /usr/share/nginx/html/ca.crt
              subPath: ca.crt
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      restartPolicy: Always
      volumes:
        - name: ca
          configMap:
            name: yanello-ca
        - name: nginx-conf
          configMap:
            name: ca-server-nginx
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-server-nginx
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
      }
      location = /ca.crt {
        default_type application/x-pem-file;
        add_header Content-Disposition 'attachment; filename="yanello-root-ca.crt"';
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: ca-server
spec:
  selector:
    app: ca-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ca-server
spec:
  parentRefs:
    - name: cilium-private-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: cilium
      sectionName: https
  hostnames:
    - ca.yanello.net
  rules:
    - backendRefs:
        - name: ca-server
          group: ""
          kind: Service
          port: 8080
          weight: 1
