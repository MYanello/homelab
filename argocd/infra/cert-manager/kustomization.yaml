---
resources:
  - ./manifests/resources.yaml

generators:
  - ./manifests/secret-generator.yaml

helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: "v1.21.1"
    releaseName: cert-manager
    namespace: cert-manager
    valuesInline:
      installCRDs: true
      featureGates: NameConstraints=true
      webhook:
        featureGates: NameConstraints=true
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 32Mi
      extraArgs:
        - --dns01-recursive-nameservers-only
        - --dns01-recursive-nameservers=8.8.8.8:53
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      cainjector:
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
        resources:
          requests:
            cpu: 10m
            memory: 192Mi
          limits:
            memory: 256Mi
      startupapicheck:
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
