---
resources:
  - ./manifests/ext-secrets.yaml
  - ./manifests/netpol.yaml
  - ./manifests/letsencrypt-issuer.yaml
  - ./manifests/local-issuer.yaml
  - ./manifests/vault-issuer.yaml

helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: "v1.21.3"
    releaseName: cert-manager
    namespace: cert-manager
    valuesFile: ./values.yaml
