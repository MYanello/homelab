---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nix-cache-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: nix-cache-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: nix-cache
