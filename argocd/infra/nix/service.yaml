---
apiVersion: v1
kind: Service
metadata:
  name: nix-cache
  labels:
    app.kubernetes.io/name: nix-cache
spec:
  selector:
    app.kubernetes.io/name: nix-cache
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nix-cache-ssh
  labels:
    app.kubernetes.io/name: nix-cache
  annotations:
    lbipam.cilium.io/ips: 10.10.8.106
    external-dns.kubernetes.io/hostname: nix-ssh.yanello.net
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: nix-cache
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
      protocol: TCP
