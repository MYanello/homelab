---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nix-cache
spec:
  parentRefs:
    - name: cilium-public-gateway
      namespace: cilium
      sectionName: https
    - name: cilium-private-gateway
      namespace: cilium
      sectionName: https
  hostnames:
    - cache.yanello.net
  rules:
    - backendRefs:
        - name: nix-cache
          port: 5000
