global
  log stdout format raw local0
  maxconn 4096

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 1m
  timeout server 1m

# Public HTTPS edge: read the SNI from the TLS ClientHello and forward the raw
# TLS stream. We never terminate here; terminate-capable hosts go to the public
# gateway, passthrough hosts go to the private TLS passthrough gateway.
frontend https
  bind :8443
  tcp-request inspect-delay 5s
  tcp-request content accept if { req_ssl_hello_type 1 }
  acl passthrough req_ssl_sni -i truenas.yanello.net
  acl passthrough req_ssl_sni -i vault.yanello.net
  acl passthrough req_ssl_sni -i unifi.yanello.net
  use_backend tls-passthrough if passthrough
  default_backend https-terminate

frontend http
  bind :8080
  default_backend http-terminate

# Passthrough: cilium-public-tls-gateway 
backend tls-passthrough
  server gateway cilium-gateway-cilium-public-tls-gateway.cilium:443

# Terminate: cilium-public-gateway
backend https-terminate
  server gateway cilium-gateway-cilium-public-gateway.cilium:443

backend http-terminate
  server gateway 10.10.8.101:80 send-proxy-v2
