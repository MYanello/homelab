---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: opnsense-route
spec:
  parentRefs:
    - name: private-tls-passthrough-gateway
      namespace: cilium
      group: gateway.networking.k8s.io
      kind: Gateway
      sectionName: tls-passthrough
  hostnames:
    - opn.yanello.net
    - router.yanello.net
  rules:
    - backendRefs:
        - name: opnsense-service
          group: ""
          kind: Service
          port: 1000
          weight: 1
---
apiVersion: v1
kind: Service
metadata:
  name: opnsense-service
spec:
  ports:
    - name: https
      protocol: TCP
      port: 1000
      targetPort: 1000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: opnsense-service-1 # by convention, use the name of the Service
  # as a prefix for the name of the EndpointSlice
  labels:
    # You should set the "kubernetes.io/service-name" label.
    # Set its value to match the name of the Service
    kubernetes.io/service-name: opnsense-service
    endpointslice.kubernetes.io/managed-by: cluster-admin
addressType: IPv4
ports:
  - name: https # should match with the name of the service port defined above
    appProtocol: https
    protocol: TCP
    port: 1000
endpoints:
  - addresses:
      - 192.168.1.1
    conditions:
      ready: true
