---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pikvm-httproute
spec:
  hostnames:
    - pikvm.yanello.net
  parentRefs:
    - name: cilium-private-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: cilium
      sectionName: https
  rules:
    - backendRefs:
        - name: pikvm-service
          group: ""
          kind: Service
          port: 443
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
    - backendRefs:
        - name: pikvm-service
          group: ""
          kind: Service
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /.well-known/acme-challenge
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: pikvm-backend-tls
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: pikvm-service
      sectionName: https
  validation:
    caCertificateRefs:
      - name: yanello-ca
        group: ""
        kind: ConfigMap
    hostname: pikvm.yanello.net
---
apiVersion: v1
kind: Service
metadata:
  name: pikvm-service
spec:
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pikvm-service-1 # by convention, use the name of the Service
  # as a prefix for the name of the EndpointSlice
  labels:
    # You should set the "kubernetes.io/service-name" label.
    # Set its value to match the name of the Service
    kubernetes.io/service-name: pikvm-service
    endpointslice.kubernetes.io/managed-by: cluster-admin
addressType: IPv4
ports:
  - name: https # should match with the name of the service port defined above
    appProtocol: https
    protocol: TCP
    port: 443
  - name: http # should match with the name of the service port defined above
    appProtocol: http
    protocol: TCP
    port: 80
endpoints:
  - addresses:
      - 192.168.1.9
    conditions:
      ready: true
