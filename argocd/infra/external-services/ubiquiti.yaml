---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: ubiquiti-backend-tls
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: ubiquiti-service
      sectionName: https
  validation:
    caCertificateRefs:
      - name: ubiquiti-ca
        group: ""
        kind: ConfigMap
    hostname: unifi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ubiquiti
spec:
  hostnames:
    - ui.yanello.net
  parentRefs:
    - name: cilium-private-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: cilium
      sectionName: https
  rules:
    - backendRefs:
        - name: ubiquiti-service
          group: ""
          kind: Service
          port: 8443
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: v1
kind: Service
metadata:
  name: ubiquiti-service
spec:
  ports:
    - name: https
      protocol: TCP
      port: 8443
      targetPort: 8443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ubiquiti-service-1
  labels:
    kubernetes.io/service-name: ubiquiti-service
    endpointslice.kubernetes.io/managed-by: cluster-admin
addressType: IPv4
ports:
  - name: https
    appProtocol: https
    protocol: TCP
    port: 8443
endpoints:
  - addresses:
      - 192.168.1.4
    conditions:
      ready: true
