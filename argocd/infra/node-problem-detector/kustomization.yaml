---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: node-problem-detector
    namespace: node-problem-detector
    releaseName: node-problem-detector
    repo: https://charts.deliveryhero.io/
    version: "2.3.14"
    valuesInline:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
