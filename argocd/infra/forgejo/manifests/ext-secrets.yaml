---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: forgejo-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: forgejo/forgejo-secrets
