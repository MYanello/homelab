---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./manifests/ext-secrets.yaml
  - ./manifests/netpol.yaml
  - ./manifests/http-route.yaml
  - ./manifests/runner.yaml

helmCharts:
  - name: forgejo
    repo: oci://code.forgejo.org/forgejo-helm
    version: "17.3.3"
    releaseName: forgejo
    namespace: forgejo
    valuesFile: ./manifests/values.yaml
