---
csiDriver:
  # should be globally unique for a given cluster
  name: "org.democratic-csi.nfs.hdd"

node:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "csp/oci"
      operator: "Exists"
      effect: "NoSchedule"
  driver:
    resources:
      requests:
        cpu: 30m
        memory: 96Mi
      limits:
        memory: 128Mi
    cleanup:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
  csiProxy:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  driverRegistrar:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 16Mi
controller:
  driver:
    image:
      tag: next
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 96Mi
  csiProxy:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  externalAttacher:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 32Mi
  externalProvisioner:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 32Mi
  externalResizer:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 64Mi
  externalSnapshotter:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 16Mi
storageClasses:
  - name: truenas-hdd-nfs
    defaultClass: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      # for block-based storage can be ext3, ext4, xfs
      # for nfs should be nfs
      fsType: nfs

      # if true, volumes created from other snapshots will be
      # zfs send/received instead of zfs cloned
      # detachedVolumesFromSnapshots: "false"

      # if true, volumes created from other volumes will be
      # zfs send/received instead of zfs cloned
      # detachedVolumesFromVolumes: "false"

    mountOptions:
      - nfsvers=4.2
      - nconnect=8
      - hard
      - intr
      - rsize=131072
      - wsize=131072
      - timeo=600
      - retrans=2
    secrets:
      provisioner-secret: null
      controller-publish-secret: null
      node-stage-secret: null
      node-publish-secret: null
      controller-expand-secret: null

driver:
  existingConfigSecret: democratic-secret
  config:
    driver: freenas-api-nfs
