---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: s3-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: longhorn-system/s3-secrets
