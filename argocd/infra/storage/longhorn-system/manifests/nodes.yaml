---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: pi0
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,ServerSideApply=true
spec:
  allowScheduling: false
  disks:
    usb:
      path: /mnt/usb/longhorn
      allowScheduling: false
      diskType: filesystem
      tags:
        - usb
