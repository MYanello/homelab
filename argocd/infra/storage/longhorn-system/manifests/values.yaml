---
defaultSettings:
  defaultDataPath: "/app/longhorn/"
  defaultReplicaCount: "3"
  defaultDataLocality: "best-effort"
  taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule"
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  guaranteedInstanceManagerCPU: "5"

defaultBackupStore:
  backupTarget: "s3://myanello-longhorn@s3.us-west-004/"
  backupTargetCredentialSecret: "s3-secrets"

preUpgradeChecker:
  jobEnabled: true

persistence:
  defaultClassReplicaCount: "2"
  defaultDataLocality: best-effort

global:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
longhornManager:
  resources:
    requests:
      cpu: 50m
      memory: 400Mi
    limits:
      memory: 500Mi
  initContainer:
    resources:
      requests:
        cpu: 10m
        memory: 30Mi
      limits:
        memory: 75Mi
longhornCsiPlugin:
  resources:
    requests:
      cpu: 10m
      memory: 30Mi
    limits:
      memory: 30Mi
csi:
  attacher:
    resources:
      requests:
        cpu: 10m
        memory: 30Mi
      limits:
        memory: 30Mi
  provisioner:
    resources:
      requests:
        cpu: 10m
        memory: 30Mi
      limits:
        memory: 30Mi
  resizer:
    resources:
      requests:
        cpu: 10m
        memory: 30Mi
      limits:
        memory: 30Mi
  snapshotter:
    resources:
      requests:
        cpu: 10m
        memory: 30Mi
      limits:
        memory: 30Mi
longhornDriverDeployer:
  resources:
    requests:
      cpu: 10m
      memory: 15Mi
    limits:
      memory: 20Mi
  initContainer:
    resources:
      requests:
        cpu: 10m
        memory: 75Mi
      limits:
        memory: 125Mi
longhornUi:
  resources:
    requests:
      cpu: 10m
      memory: 25Mi
    limits:
      memory: 75Mi
