---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rclone
  labels:
    app: rclone
spec:
  replicas: 1
  serviceName: rclone
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: rclone
  template:
    metadata:
      labels:
        app: rclone
    spec:
      initContainers:
        - name: generate-htpasswd
          image: harbor.yanello.net/docker/httpd:alpine3.24@sha256:759a1d9178d351185978e41be37a3e91675a4ddc0653aa5df493cfd4c67e24ec
          command: ["sh", "-c"]
          args:
            - |
              htpasswd -cbB /config/rclone/htpasswd "$USER" "$PASS"
          envFrom:
            - secretRef:
                name: htpasswd
          volumeMounts:
            - name: config
              mountPath: /config/rclone
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 250Mi
      containers:
        - name: rclone
          imagePullPolicy: IfNotPresent
          image: harbor.yanello.net/docker/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
          args:
            - rcd
            - --rc-web-gui
            - --rc-web-gui-no-open-browser
            - --rc-addr=:5572
            - --rc-htpasswd=/config/rclone/htpasswd
          ports:
            - containerPort: 5572
              protocol: TCP
              name: http
          volumeMounts:
            - mountPath: /config/rclone
              name: config
          resources:
            requests:
              cpu: 50m
              memory: 250Mi
            limits:
              memory: 500Mi
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: truenas-ssd-nfs
        resources:
          requests:
            storage: 1Gi
