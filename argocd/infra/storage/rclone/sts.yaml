---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rclone
  labels:
    app: rclone
spec:
  replicas: 1
  serviceName: rclone
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: rclone
  template:
    metadata:
      labels:
        app: rclone
    spec:
      containers:
        - name: rclone
          imagePullPolicy: IfNotPresent
          image: harbor.yanello.net/docker/rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
          command:
            - sh
            - -c
            - 'exec rclone gui --addr=:5572 --api-addr=:5573 --no-open-browser --user="$USER"
              --pass="$PASS"'
          envFrom:
            - secretRef:
                name: htpasswd
          ports:
            - containerPort: 5572
              protocol: TCP
              name: http
            - containerPort: 5573
              protocol: TCP
              name: api
          volumeMounts:
            - mountPath: /config/rclone
              name: config
          resources:
            requests:
              cpu: 50m
              memory: 250Mi
            limits:
              memory: 500Mi
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: truenas-ssd-nfs
        resources:
          requests:
            storage: 1Gi
