---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rclone
  labels:
    app: rclone
spec:
  replicas: 1
  serviceName: rclone
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: rclone
  template:
    metadata:
      labels:
        app: rclone
    spec:
      initContainers:
        - name: generate-htpasswd
          image: harbor.yanello.net/docker/httpd:alpine3.24@sha256:d72968666c0a6961b07036d85fc053bc3cf640583cb1ff8360e1617818f164dc
          command: ["sh", "-c"]
          args:
            - |
              htpasswd -cbB /config/rclone/htpasswd "$USER" "$PASS"
          envFrom:
            - secretRef:
                name: htpasswd
          volumeMounts:
            - name: config
              mountPath: /config/rclone
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 250Mi
      containers:
        - name: rclone
          imagePullPolicy: IfNotPresent
          image: harbor.yanello.net/docker/rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
          args:
            - rcd
            - --rc-web-gui
            - --rc-web-gui-no-open-browser
            - --rc-addr=:5572
            - --rc-htpasswd=/config/rclone/htpasswd
          ports:
            - containerPort: 5572
              protocol: TCP
              name: http
          volumeMounts:
            - mountPath: /config/rclone
              name: config
          resources:
            requests:
              cpu: 50m
              memory: 250Mi
            limits:
              memory: 500Mi
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: truenas-ssd-nfs
        resources:
          requests:
            storage: 1Gi
