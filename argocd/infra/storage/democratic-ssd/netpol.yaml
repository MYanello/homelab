---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: democratic-ssd-controller
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/csi-role: controller
  ingress: []
  egress:
    - toCIDR:
        - 192.168.10.44/32
        - 192.168.10.55/32
        - 192.168.10.66/32
        - 192.168.10.100/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDR:
        - 192.168.10.78/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
