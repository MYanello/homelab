---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: democratic-ssd-controller
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/csi-role: controller
  ingress: []
  egress:
    - toCIDR:
        - 192.168.10.0/24
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toCIDR:
        - 192.168.10.78/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
