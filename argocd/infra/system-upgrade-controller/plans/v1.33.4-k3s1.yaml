---
# Server plan
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      value: "true"
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade@sha256:f523c4ab1c5654b6430335b049470fb8d9afb4434963ada34f011bfb6d62d18a
  version: v1.33.4+k3s1
---
# Agent plan
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  prepare:
    args:
      - prepare
      - server-plan
    image: rancher/k3s-upgrade@sha256:f523c4ab1c5654b6430335b049470fb8d9afb4434963ada34f011bfb6d62d18a
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade@sha256:f523c4ab1c5654b6430335b049470fb8d9afb4434963ada34f011bfb6d62d18a
  version: v1.33.4+k3s1
