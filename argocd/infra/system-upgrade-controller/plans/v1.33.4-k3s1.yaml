---
# Server plan
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      value: "true"
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade@sha256:7a83f0637c81168a7560000f2bdc972c88f621d7a9872e6afe3bba2d40964d74
  version: v1.33.4+k3s1
---
# Agent plan
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  prepare:
    args:
      - prepare
      - server-plan
    image: rancher/k3s-upgrade@sha256:7a83f0637c81168a7560000f2bdc972c88f621d7a9872e6afe3bba2d40964d74
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade@sha256:7a83f0637c81168a7560000f2bdc972c88f621d7a9872e6afe3bba2d40964d74
  version: v1.33.4+k3s1
