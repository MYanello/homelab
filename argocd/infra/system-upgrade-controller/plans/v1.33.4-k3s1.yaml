---
# Server plan
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      value: "true"
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade@sha256:dcb1bbb5c0dd62cfd57c42dc5c86eb9a3d8c003d5705bbdccae4ec90a87f7d82
  version: v1.33.4+k3s1
---
# Agent plan
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  prepare:
    args:
      - prepare
      - server-plan
    image: rancher/k3s-upgrade@sha256:dcb1bbb5c0dd62cfd57c42dc5c86eb9a3d8c003d5705bbdccae4ec90a87f7d82
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade@sha256:dcb1bbb5c0dd62cfd57c42dc5c86eb9a3d8c003d5705bbdccae4ec90a87f7d82
  version: v1.33.4+k3s1
