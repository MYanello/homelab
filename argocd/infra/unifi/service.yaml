---
apiVersion: v1
kind: Service
metadata:
  name: unifi
spec:
  type: LoadBalancer
  loadBalancerIP: 10.10.8.30
  selector:
    app: unifi
  ports:
    - name: https
      protocol: TCP
      port: 8443
      targetPort: 8443
    - name: inform
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: stun
      protocol: UDP
      port: 3478
      targetPort: 3478
    - name: discovery
      protocol: UDP
      port: 10001
      targetPort: 10001
    - name: guest-https
      protocol: TCP
      port: 8843
      targetPort: 8843
    - name: guest-http
      protocol: TCP
      port: 8880
      targetPort: 8880
    - name: speedtest
      protocol: TCP
      port: 6789
      targetPort: 6789
    - name: l2-discovery
      protocol: UDP
      port: 1900
      targetPort: 1900
    - name: syslog
      protocol: UDP
      port: 5514
      targetPort: 5514
