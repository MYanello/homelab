---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: unifi-backend-tls
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: unifi
      sectionName: https
  validation:
    caCertificateRefs:
      - name: ubiquiti-ca
        group: ""
        kind: ConfigMap
    hostname: unifi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: UniFi
    gethomepage.dev/icon: unifi
    gethomepage.dev/description: UniFi Network Application
    gethomepage.dev/pod-selector: app=unifi
  labels:
    app.kubernetes.io/instance: unifi-app
  name: unifi-http-route
spec:
  hostnames:
    - ui.yanello.net
  parentRefs:
    - name: cilium-private-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: cilium
      sectionName: https
  rules:
    - backendRefs:
        - name: unifi
          group: ""
          kind: Service
          port: 8443
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
