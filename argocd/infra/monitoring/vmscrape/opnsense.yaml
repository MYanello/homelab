---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMScrapeConfig
metadata:
  name: opnsense
spec:
  scrape_interval: 60s
  staticConfigs:
    - targets:
        - 192.168.1.1:9100
  path: /metrics
  scheme: http
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMScrapeConfig
metadata:
  name: crowdsec
spec:
  scrape_interval: 60s
  staticConfigs:
    - targets:
        - 192.168.10.1:6060
  path: /metrics
  scheme: http
