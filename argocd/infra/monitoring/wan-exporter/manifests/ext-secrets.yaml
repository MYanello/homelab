---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wan-exporter-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: wan-exporter-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monitoring/wan-exporter-secrets
