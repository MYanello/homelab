---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: wan-exporter
  name: wan-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: wan-exporter
  template:
    metadata:
      labels:
        app: wan-exporter
    spec:
      imagePullSecrets:
        - name: cwcr-dockerconfig
      containers:
        - image: harbor.yanello.net/library/wan-exporter:v0.4.6@sha256:14ad53991118f1630676688fd8f395bcbe4f38ff6a2f7eded993e305663aeec7
          name: wan-exporter
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: wan-exporter-secrets
          ports:
            - containerPort: 9101
              protocol: TCP
          resources:
            limits:
              memory: 64Mi
            requests:
              memory: 16Mi
              cpu: 10m
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9101
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 9101
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
