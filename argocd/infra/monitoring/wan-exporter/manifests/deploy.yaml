---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: wan-exporter
  name: wan-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: wan-exporter
  template:
    metadata:
      labels:
        app: wan-exporter
    spec:
      imagePullSecrets:
        - name: cwcr-dockerconfig
      containers:
        - image: harbor.yanello.net/library/wan-exporter:v0.4.9@sha256:f7123e311774821c22e045bf4a133d154c87a0ee67bf7e4cfd8ebd686796e985
          name: wan-exporter
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: wan-exporter-secrets
          env:
            - name: LOG_LEVEL
              value: DEBUG
          ports:
            - containerPort: 9101
              protocol: TCP
          resources:
            limits:
              memory: 64Mi
            requests:
              memory: 16Mi
              cpu: 10m
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9101
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 9101
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
