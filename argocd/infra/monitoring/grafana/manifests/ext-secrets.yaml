---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-env-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: grafana-env-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monitoring/grafana-env-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: grafana-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monitoring/grafana-secrets
