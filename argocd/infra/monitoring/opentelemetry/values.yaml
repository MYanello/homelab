---
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
mode: daemonset
presets:
  logsCollection:
    enabled: true
  kubernetesAttributes:
    enabled: true

config:
  processors:
    batch:
      send_batch_size: 1000
      timeout: 10s
    deltatocumulative:
      max_stale: 5m
  exporters:
    otlphttp/victoriametrics:
      encoding: proto
      compression: gzip
      metrics_endpoint: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8429/opentelemetry/v1/metrics
      logs_endpoint: http://victoria-logs-single-server.monitoring.svc.cluster.local:9428/insert/opentelemetry/v1/logs
    debug:
      verbosity: detailed
  service:
    pipelines:
      logs:
        receivers: [otlp, filelog]
        processors: [batch]
        exporters: [otlphttp/victoriametrics]
      metrics:
        receivers: [otlp]
        processors: [deltatocumulative]
        exporters: [otlphttp/victoriametrics]
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

resources:
  requests:
    cpu: 20m
    memory: 100Mi
  limits:
    memory: 150Mi
