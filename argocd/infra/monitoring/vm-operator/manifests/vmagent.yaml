---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  labels:
    app.kubernetes.io/component: vmagent
    app.kubernetes.io/instance: victoria-metrics-k8s-stack
    app.kubernetes.io/name: victoria-metrics-k8s-stack
    app.kubernetes.io/version: v1.157.0
  name: victoria-metrics-k8s-stack
spec:
  externalLabels: {}
  extraArgs:
    promscrape.maxScrapeSize: 32MB
    promscrape.streamParse: "true"
  image:
    tag: v1.157.0
  port: "8429"
  remoteWrite:
    - url: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local.:8428/api/v1/write
  resources:
    limits:
      memory: 8Gi
    requests:
      cpu: 150m
      memory: 500Mi
  scrapeInterval: 20s
  selectAllByDefault: true
