    - alertmanager.yanello.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium-private-gateway
      namespace: cilium
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: vmalertmanager-victoria-metrics-k8s-stack
          port: 9093
