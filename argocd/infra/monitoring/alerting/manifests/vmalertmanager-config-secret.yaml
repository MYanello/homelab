---
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/component: alertmanager
    app.kubernetes.io/instance: victoria-metrics-k8s-stack
    app.kubernetes.io/name: victoria-metrics-k8s-stack
    app.kubernetes.io/version: v1.157.0
  name: vmalertmanager-victoria-metrics-k8s-stack
stringData:
  alertmanager.yaml: |-
    global:
      resolve_timeout: 5m
    receivers:
    - name: ntfy
      webhook_configs:
      - http_config:
          http_headers:
            Click:
              values:
              - https://alertmanager.yanello.net/#/alerts
            Priority:
              values:
              - high
            Tags:
              values:
              - rotating_light
        send_resolved: true
        url_file: /etc/alertmanager-ntfy/url
    route:
      group_by:
      - alertname
      - namespace
      group_interval: 5m
      group_wait: 30s
      receiver: ntfy
      repeat_interval: 12h
    templates:
    - /etc/vm/templates/**/*.tmpl
