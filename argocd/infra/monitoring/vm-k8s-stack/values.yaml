---
victoria-metrics-operator:
  enabled: true
  admissionWebhooks:
    enabled: true
    policy: Ignore
    certManager:
      enabled: true
      name: local-intermediate-ca1-issuer
      kind: ClusterIssuer
      group: cert-manager.io
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi

vmagent:
  enabled: true
  spec:
    extraArgs:
      promscrape.maxScrapeSize: "32MB"
    resources:
      requests:
        cpu: 150m
        memory: 500Mi
      limits:
        memory: 8Gi

kubelet:
  enabled: true
  vmScrape:
    spec:
      interval: 60s
      metricRelabelConfigs:
        - action: labeldrop
          regex: (uid)
        - action: labeldrop
          regex: (id|name)
        - action: labeldrop
          regex: (feature_node_kubernetes_io_.*|nvidia_com_.*|beta_kubernetes_io_.*)
        - action: drop
          source_labels: [__name__]
          regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
        - action: drop
          source_labels: [__name__]
          regex: apiserver_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_storage_list_duration_seconds_bucket|apiserver_watch_events_dispatch_duration_seconds_bucket|apiserver_watch_events_sizes_bucket|apiserver_watch_list_duration_seconds_bucket|apiserver_watch_cache_initialization_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket|etcd_request_duration_seconds_bucket

kubeApiServer:
  enabled: true
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          interval: 60s
          metricRelabelConfigs:
            - action: drop
              source_labels: [__name__]
              regex: apiserver_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_storage_list_duration_seconds_bucket|apiserver_watch_events_dispatch_duration_seconds_bucket|apiserver_watch_events_sizes_bucket|apiserver_watch_list_duration_seconds_bucket|apiserver_watch_cache_initialization_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket|etcd_request_duration_seconds_bucket
          port: https
          scheme: https
          tlsConfig:
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            serverName: kubernetes

kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 96Mi
  collectorsExclude:
    - configmaps
    - secrets
    - mutatingwebhookconfigurations
    - validatingwebhookconfigurations
    - replicasets
    - replicationcontrollers
    - clusterrolebindings
    - clusterroles
    - rolebindings
    - roles
    - serviceaccounts
    - endpointslice
  vmScrape:
    enabled: true
    spec:
      endpoints:
        - port: http
          honorLabels: true
          interval: 60s
          metricRelabelConfigs:
            - action: labeldrop
              regex: (uid|container_id|image_id)
            - action: drop
              source_labels: [__name__]
              regex: kube_.*_created|kube_.*_metadata_resource_version|kube_configmap_.*|kube_secret_.*|kube_mutatingwebhookconfiguration_.*|kube_validatingwebhookconfiguration_.*|kube_replicaset_.*|kube_replicationcontroller_.*|kube_clusterrolebinding_.*|kube_clusterrole_.*|kube_rolebinding_.*|kube_role_.*|kube_serviceaccount_.*|kube_endpointslice_.*

vmsingle:
  enabled: true
  spec:
    retentionPeriod: 365d
    storage:
      storageClassName: "truenas-hdd"
      resources:
        requests:
          storage: 500Gi
    insertPorts:
      influxPort: "8086"
    extraEnvs:
      - name: search_cacheTimestampOffset
        value: "10000h"
      - name: search_cacheMaxAge
        value: "7d"
      - name: influx_databaseNames
        value: "home"
    extraArgs:
      maxLabelsPerTimeseries: "500"
      storage.minFreeDiskSpaceBytes: "10GB"
      search.maxQueryDuration: "60s"
      search.maxConcurrentRequests: "32"
      search.maxQueueDuration: "60s"
    serviceSpec:
      spec:
        type: LoadBalancer
        loadBalancerIP: 10.10.8.10
    resources:
      requests:
        cpu: 150m
        memory: 15Gi
      limits:
        memory: 32Gi

syncJob:
  enabled: false

grafana:
  enabled: false
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

vmalert:
  enabled: true
  route:
    enabled: true
    parentRefs:
      - name: cilium-private-gateway
        group: gateway.networking.k8s.io
        kind: Gateway
        namespace: cilium
        sectionName: https
    hostnames:
      - vmalert.yanello.net

alertmanager:
  route:
    enabled: true
    parentRefs:
      - name: cilium-private-gateway
        group: gateway.networking.k8s.io
        kind: Gateway
        namespace: cilium
        sectionName: https
    hostnames:
      - alertmanager.yanello.net
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: ntfy
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
    receivers:
      - name: ntfy
        webhook_configs:
          - url_file: /etc/alertmanager-ntfy/url
            send_resolved: true
            http_config:
              http_headers:
                Priority:
                  values:
                    - high
                Tags:
                  values:
                    - rotating_light
                Click:
                  values:
                    - https://alertmanager.yanello.net/#/alerts
  spec:
    volumes:
      - name: ntfy-url
        secret:
          secretName: vmalertmanager-ntfy
    volumeMounts:
      - name: ntfy-url
        mountPath: /etc/alertmanager-ntfy
        readOnly: true
