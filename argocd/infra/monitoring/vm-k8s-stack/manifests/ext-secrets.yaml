---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeassistant-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: homeassistant-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monitoring/homeassistant-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmalertmanager-ntfy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: vmalertmanager-ntfy
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monitoring/vmalertmanager-ntfy
