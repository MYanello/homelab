---
image:
  repository: harbor.yanello.net/docker/louislam/uptime-kuma
  tag: 2.5.10@sha256:3256c6ae95a1d9707da05fe21c4a7f82cbc20e1f7dec8abdb301cae12cb1246f

volume:
  storageClassName: truenas-ssd-nfs
  accessMode: ReadWriteMany

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists

externalDatabase:
  enabled: true
  hostname: mariadb
  port: 3306
  database: kuma
  existingSecret: mariadb-secrets
  existingSecretPasswordKey: MARIADB_PASSWORD
  existingSecretUsernameKey: MARIADB_USER
resources:
  requests:
    cpu: 20m
    memory: 100Mi
  limits:
    memory: 400Mi
