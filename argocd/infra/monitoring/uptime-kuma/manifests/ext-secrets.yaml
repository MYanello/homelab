---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: mariadb-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monitoring/mariadb-secrets
