---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: adguard-exporter
spec:
  selector:
    matchLabels:
      app: adguard-exporter
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      scrapeTimeout: 10s
      interval: 15s
      metricRelabelConfigs:
        - action: drop
          source_labels: [__name__]
          regex: adguard_query_domain_total
