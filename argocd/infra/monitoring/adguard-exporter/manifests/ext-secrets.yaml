---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adguard-exporter-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: adguard-exporter-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monitoring/adguard-exporter-secrets
