---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntopng-exporter-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: ntopng-exporter-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monitoring/ntopng-exporter-config
