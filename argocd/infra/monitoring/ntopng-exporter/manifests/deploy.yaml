---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ntopng-exporter
  name: ntopng-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ntopng-exporter
  template:
    metadata:
      labels:
        app: ntopng-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - image: harbor.yanello.net/docker/aauren/ntopng-exporter:v1.8.0@sha256:899c0465856a81caeddc76ea1f62f37cfb7c0a8c7b41917cf7cf84faeeb8418a
          name: ntopng-exporter
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              protocol: TCP
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /etc/ntopng-exporter
              readOnly: true
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 32Mi
              cpu: 10m
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          secret:
            secretName: ntopng-exporter-config
