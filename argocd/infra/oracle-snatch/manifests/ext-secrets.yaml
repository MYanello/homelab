---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oracle-snatch-oci
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: oracle
    creationPolicy: Owner
  data:
    - remoteRef:
        key: oracle
        property: private.pem
      secretKey: private.pem
