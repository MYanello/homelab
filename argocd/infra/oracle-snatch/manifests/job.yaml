---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: oracle-snatch
  name: oracle-snatch
spec:
  backoffLimit: 100
  template:
    metadata:
      labels:
        app: oracle-snatch
    spec:
      containers:
        - name: oracle-snatch
          image: harbor.yanello.net/library/oracle-snatch:0.2.3@sha256:d3e2e628c32b07a16df0f72547e3bb9596dd8ec73bb5f5f81c52f580dc9c0adf
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: oracle-snatch-config
          env:
            - name: NTFY_TOPIC
              valueFrom:
                secretKeyRef:
                  name: oracle
                  key: NTFY_TOPIC
          volumeMounts:
            - name: oci-config
              mountPath: /etc/oracle-snatch/oci/config
              subPath: config
              readOnly: true
            - name: oci-key
              mountPath: /etc/oracle-snatch/oci/private.pem
              subPath: private.pem
              readOnly: true
            - name: ssh-pubkey
              mountPath: /etc/oracle-snatch/ssh/id_ed25519.pub
              subPath: id_ed25519.pub
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
            limits:
              memory: 250Mi
      restartPolicy: OnFailure
      volumes:
        - name: oci-config
          configMap:
            name: oracle-snatch-oci-config
        - name: oci-key
          secret:
            secretName: oracle
            defaultMode: 0400
            items:
              - key: private.pem
                path: private.pem
        - name: ssh-pubkey
          configMap:
            name: oracle-snatch-config
            items:
              - key: id_ed25519.pub
                path: id_ed25519.pub
