---
kubeProxyReplacement: true
k8sServiceHost: 192.168.10.100
k8sServicePort: 6443

policyAuditMode: true

ingressController:
  enabled: false
  loadBalancerMode: shared
  default: true
  service:
    annotations:
      io.cilium/lb-ipam-ips: 10.10.8.0/22
rollOutCiliumPods: true

ipam:
  operator:
    clusterPoolIPv4PodCIDRList: 10.42.0.0/16
devices: eth0
gatewayAPI:
  enabled: true
  xffNumTrustedHops: 2

# for preserving source ips
loadBalancer:
  mode: dsr
  dsrDispatch: opt
routingMode: native
enableIPv4Masquerade: true
ipv4NativeRoutingCIDR: 10.0.0.0/8
autoDirectNodeRoutes: true

envoy:
  securityContext:
    capabilities:
      keepCapNetBindService: true

  resources:
    requests:
      cpu: 20m
      memory: 100Mi
    limits:
      memory: 200Mi
hubble:
  enabled: true
  eventBufferCapacity: "65535"
  ui:
    enabled: true
    backend:
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
        limits:
          memory: 100Mi
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 20Mi
        limits:
          memory: 100Mi
  relay:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 50Mi
bgpControlPlane:
  enabled: true

authentication:
  mutual:
    spire:
      enabled: false
      install:
        enabled: false

cluster:
  name: home
  id: 1
resources:
  requests:
    cpu: 90m
    memory: 800Mi
  limits:
    memory: 1Gi
operator:
  resources:
    requests:
      cpu: 20m
      memory: 100Mi
    limits:
      memory: 200Mi
