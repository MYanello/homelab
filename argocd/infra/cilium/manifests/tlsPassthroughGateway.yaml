---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private-tls-passthrough-gateway
  labels:
    external-dns.yanello.net/gateway: private
spec:
  gatewayClassName: cilium
  addresses:
    - value: 10.10.8.104
      type: IPAddress
  listeners:
    - name: tls-passthrough
      protocol: TLS
      hostname: "*.yanello.net"
      port: 443
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
