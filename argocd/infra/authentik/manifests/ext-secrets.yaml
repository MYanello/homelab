---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: authentik
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ldap-outpost-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: ldap-outpost-api
    creationPolicy: Owner
  data:
    - remoteRef:
        key: authentik
        property: LDAP_TOKEN
      secretKey: AUTHENTIK_TOKEN
