---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: backrest
  labels:
    app.kubernetes.io/name: backrest
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: backrest
      app.kubernetes.io/instance: backrest
  namespaceSelector:
    matchNames:
      - backrest
  endpoints:
    - port: http-monitoring
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
