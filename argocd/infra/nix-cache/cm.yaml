---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nix-cache-config
data:
  harmonia.toml: |-
    bind = "0.0.0.0:5000"
    workers = 4
    max_connection_rate = 256
    priority = 30
    enable_compression = true
    sign_key_paths = ["/keys/cache.key"]
  nix.conf: |
    extra-trusted-public-keys = nix-cache.yanello.net-1:bWUWi7WOldRLLH8TjeBV0MP55jTgP98wC6JqCOQW9B4=
    require-sigs = false
    build-users-group =
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nix-build-config
data:
  nix.conf: |-
    experimental-features = nix-command flakes
    build-users-group =
    fallback = true
    extra-substituters = http://nix-cache.nix-cache.svc.cluster.local:5000
    extra-trusted-public-keys = nix-cache.yanello.net-1:bWUWi7WOldRLLH8TjeBV0MP55jTgP98wC6JqCOQW9B4=
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nix-gc-config
data:
  gc-nix.conf: |-
    experimental-features = nix-command flakes
    build-users-group =
