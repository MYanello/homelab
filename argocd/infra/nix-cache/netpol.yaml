---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nix-cache
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nix-cache
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: nix-cache
            k8s:app.kubernetes.io/name: nix-cache-build
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
            - port: "5000"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
    - fromCIDR:
        - 192.168.0.0/16
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
            - port: "5000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: forgejo
            k8s:app.kubernetes.io/name: forgejo
      toPorts:
        - ports:
            - port: "2222"
              protocol: TCP
