---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nix-cache
  labels:
    app.kubernetes.io/name: nix-cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nix-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nix-cache
    spec:
      containers:
        - name: nix-cache
          image: harbor.yanello.net/library/nix-cache:v3.3.0-3
          env:
            - name: CONFIG_FILE
              value: /config/harmonia.toml
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
            - name: ssh
              containerPort: 22
              protocol: TCP
          volumeMounts:
            - name: nix-store
              mountPath: /nix
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /etc/nix-cache/secrets
              readOnly: true
            - name: ssh-pub-keys
              mountPath: /mnt/ssh-keys
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              memory: 1000Mi
      volumes:
        - name: nix-store
          persistentVolumeClaim:
            claimName: nix-store
        - name: config
          configMap:
            name: nix-cache-config
        - name: secrets
          secret:
            secretName: nix-cache-secrets
            defaultMode: 0400
            items:
              - key: cache-signing-key
                path: cache.key
              - key: ssh-host-ed25519-key
                path: ssh_host_ed25519_key
              - key: ssh-host-rsa-key
                path: ssh_host_rsa_key
        - name: ssh-pub-keys
          configMap:
            name: nix-cache-ssh-keys
        - name: tmp
          emptyDir: {}
