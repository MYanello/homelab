---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: upgrade-build
spec:
  schedule: "0 4 * * *"
  timeZone: "America/Toronto"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: upgrade-build
              image: harbor.yanello.net/library/nix-cache:v3.3.0-4@sha256:47c12824eea80c53bc45d9ed50d7070458a845811d31a6bec0baba0c36dbc859
              command: ["bash", "upgrade-build.sh"]
              args: ["https://forgejo.yanello.net/marcus/nix"]
              env:
                - name: NIX_CONFIG
                  value: |
                    experimental-features = nix-command flakes
                    trusted-users = root
                - name: CACHE
                  value: ssh-ng://nix@nix-cache
                - name: KEYFILE
                  value: /keys/cache.key
                - name: NIX_SSHOPTS
                  value: -i /keys/privateKey -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/keys/known_hosts
                - name: SYSTEM
                  value: x86_64-linux
                - name: WORKDIR
                  value: /work
                - name: HOME
                  value: /work
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: ssh-keys
                  mountPath: /keys
                  readOnly: true
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                  ephemeral-storage: 10Gi
                limits:
                  memory: 16Gi
                  ephemeral-storage: 50Gi
              securityContext:
                privileged: true
          volumes:
            - name: script
              configMap:
                name: upgrade-build
            - name: ssh-keys
              secret:
                defaultMode: 0400
                secretName: nix-cache-secrets
                items:
                  - key: privateKey
                    path: privateKey
            - name: work
              emptyDir: {}
