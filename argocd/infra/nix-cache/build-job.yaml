---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: upgrade-build
spec:
  schedule: "0 4 * * *"
  timeZone: "America/Toronto"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: upgrade-build
              image: harbor.yanello.net/library/nix-cache:latest@sha256:fdcaa2e342bcb106007e3076d6843a289f850517dd36b6d1d845296053c20c42
              command: ["bash", "upgrade-build.sh"]
              args:
                - ssh://git@forgejo-ssh.yanello.net/marcus/nix.git
                - "#nixosConfigurations.desktop.config.system.build.toplevel"
                - "#nixosConfigurations.laptop.config.system.build.toplevel"
                - "#homeConfigurations.hermes.activationPackage"
                - "#homeConfigurations.devshell.activationPackage"
              env:
                - name: CACHE
                  value: ssh-ng://nix@nix-cache-ssh
                - name: KEYFILE
                  value: /keys/cache.key
                - name: NIX_SSHOPTS
                  value: -i /keys/privateKey -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/keys/known_hosts
                - name: GIT_SSH_COMMAND
                  value: ssh -i /keys/privateKey -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/keys/known_hosts
                - name: SYSTEM
                  value: x86_64-linux
                - name: PUSH_BRANCH
                  value: main
                - name: WORKDIR
                  value: /work
                - name: HOME
                  value: /work
              volumeMounts:
                - name: keys
                  mountPath: /keys
                  readOnly: true
                - name: nix-store
                  mountPath: /nix
                - name: work
                  mountPath: /work
                - name: nix-conf
                  mountPath: /etc/nix
                  readOnly: true
              resources:
                requests:
                  cpu: "8"
                  memory: 4Gi
                  ephemeral-storage: 10Gi
                limits:
                  memory: 12Gi
                  ephemeral-storage: 50Gi
              securityContext:
                privileged: true
          volumes:
            - name: keys
              secret:
                defaultMode: 0400
                secretName: nix-cache-secrets
                items:
                  - key: client-key
                    path: privateKey
                  - key: cache-signing-key
                    path: cache.key
                  - key: known_hosts
                    path: known_hosts
            - name: work
              emptyDir: {}
            - name: nix-conf
              configMap:
                name: nix-build-config
            - name: nix-store
              persistentVolumeClaim:
                claimName: nix-store
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: nix-cache
                  topologyKey: kubernetes.io/hostname
