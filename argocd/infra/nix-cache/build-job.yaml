---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: upgrade-build
spec:
  schedule: "0 4 * * *"
  timeZone: "America/Toronto"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: upgrade-build
              image: harbor.yanello.net/library/nix-cache:v3.3.0-7@sha256:333c5a77c9052c826605b1054cb767c1681c1c296a6efacd08a6f4e4f3ed8fa8
              command: ["bash", "upgrade-build.sh"]
              args:
                - ssh://git@forgejo-ssh.yanello.net/marcus/nix.git
                - "#nixosConfigurations.desktop.config.system.build.toplevel"
                - "#nixosConfigurations.laptop.config.system.build.toplevel"
              env:
                - name: NIX_CONFIG
                  value: |
                    experimental-features = nix-command flakes
                    trusted-users = root
                    build-users-group =
                - name: CACHE
                  value: ssh-ng://nix@nix-cache-ssh
                - name: KEYFILE
                  value: /keys/cache.key
                - name: NIX_SSHOPTS
                  value: -i /keys/privateKey -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/keys/known_hosts
                - name: GIT_SSH_COMMAND
                  value: ssh -i /keys/privateKey -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/keys/known_hosts
                - name: SYSTEM
                  value: x86_64-linux
                - name: WORKDIR
                  value: /work
                - name: HOME
                  value: /work
              volumeMounts:
                - name: keys
                  mountPath: /keys
                  readOnly: true
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                  ephemeral-storage: 10Gi
                limits:
                  memory: 16Gi
                  ephemeral-storage: 50Gi
              securityContext:
                privileged: true
          volumes:
            - name: keys
              secret:
                defaultMode: 0400
                secretName: nix-cache-secrets
                items:
                  - key: client-key
                    path: privateKey
                  - key: cache-signing-key
                    path: cache.key
                  - key: known_hosts
                    path: known_hosts
            - name: work
              emptyDir: {}
