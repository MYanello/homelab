---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nix-cache-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: nix-cache-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: nix-cache
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: SSHKey
          name: nix-cache
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: SSHKey
metadata:
  name: nix-cache
spec:
  keyType: ed25519
  comment: nix-cache
