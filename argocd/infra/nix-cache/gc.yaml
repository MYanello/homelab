---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nix-cache-gc
spec:
  schedule: "30 5 * * *"
  timeZone: "America/Toronto"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: gc
              image: harbor.yanello.net/library/nix-cache:latest@sha256:fdcaa2e342bcb106007e3076d6843a289f850517dd36b6d1d845296053c20c42
              command: ["bash", "gc.sh"]
              env:
                - name: KEEP_RECENT
                  value: 3d
                - name: ENSURE_FREE
                  value: 50G
              volumeMounts:
                - name: nix-store
                  mountPath: /nix
                - name: nix-conf
                  mountPath: /etc/nix
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 250Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: nix-store
              persistentVolumeClaim:
                claimName: nix-store
            - name: nix-conf
              configMap:
                name: nix-gc-config
                items:
                  - key: gc-nix.conf
                    path: nix.conf
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: nix-cache
                  topologyKey: kubernetes.io/hostname
