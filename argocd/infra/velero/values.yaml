---
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

credentials:
  useSecret: true
  existingSecret: cloud-credentials

rbac:
  clusterAdministrator: true

configuration:
  backupStorageLocation:
    - name: backblaze
      provider: aws
      bucket: myanello-velero
      default: true
      credential:
        name: cloud-credentials
        key: cloud
      config:
        region: us-west-004
        s3Url: https://s3.us-west-004.backblazeb2.com
        checksumAlgorithm: ""
        tagging: ""
  volumeSnapshotLocation:
    - name: backblaze
      provider: aws
      bucket: myanello-velero
      default: true
      credential:
        name: cloud-credentials
        key: cloud
      config:
        region: us-west-004
        profile: default
        enableSharedConfig: "true"
deployNodeAgent: true
nodeAgent:
  podVolumePath: /var/lib/kubelet/pods
  privileged: false
  tolerations:
    - effect: NoSchedule
      operator: Exists
    - effect: NoExecute
      operator: Exists
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 128Mi
schedules:
  weekly:
    disabled: false
    schedule: "0 4 * * 1" # 4am monday
    paused: false
    skipImmediately: false
    template:
      ttl: "720h" # 1 month
      storageLocation: backblaze

kubectl:
  image:
    repository: harbor.yanello.net/docker/bitnamilegacy/kubectl
    tag: "1.33.4@sha256:ed0b31a0508da84ee655c5c6e01bd3897fc56ad6cf69debb27fa1893a06d2246"
resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 192Mi
initContainer:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
