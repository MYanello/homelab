---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloud-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cloud-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: velero/cloud-credentials
