---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: profilarr-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: profilarr-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: profilarr/profilarr-secrets
