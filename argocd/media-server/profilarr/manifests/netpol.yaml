---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: profilarr
spec:
  endpointSelector:
    matchLabels:
      app: profilarr
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "6868"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: profilarr
            app: parser
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: radarr
            app: radarr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: sonarr
            app: sonarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    - toCIDR:
        - 10.10.8.0/22
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: profilarr-parser
spec:
  endpointSelector:
    matchLabels:
      app: parser
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: profilarr
            app: profilarr
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
  egressDeny:
    - toEntities:
        - world
