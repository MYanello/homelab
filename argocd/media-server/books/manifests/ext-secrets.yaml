---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: bookorbit-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: books/bookorbit-secrets
