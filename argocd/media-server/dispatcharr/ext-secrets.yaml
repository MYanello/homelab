---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vpn-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: vpn-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dispatcharr/vpn-secrets
