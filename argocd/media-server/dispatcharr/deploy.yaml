---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dispatcharr
  name: dispatcharr
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: dispatcharr
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: dispatcharr
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - marcus-server
      runtimeClassName: nvidia
      containers:
        - env:
            - name: TZ
              value: America/Toronto
            - name: DISPATCHARR_ENV
              value: aio
            - name: REDIS_HOST
              value: localhost
            - name: CELERY_BROKER_URL
              value: redis://localhost:6379/0
            - name: DISPATCHARR_LOG_LEVEL
              value: info
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,video,utility
          image: harbor.yanello.net/ghcr/dispatcharr/dispatcharr:0.32.0-20261011233203@sha256:1802f831326dd56a28203571bc6dfdcdd5ca29fc712e2b6c429edc01c3f668c6
          imagePullPolicy: IfNotPresent
          name: dispatcharr
          ports:
            - containerPort: 9191
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 500Mi
              nvidia.com/gpu: "1"
            limits:
              memory: 2Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: /data
              name: data
          startupProbe:
            httpGet:
              path: /
              port: 9191
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 9191
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
