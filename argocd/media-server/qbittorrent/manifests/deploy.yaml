---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: qbittorrent
  name: qbittorrent
spec:
  selector:
    matchLabels:
      app: qbittorrent
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - marcus-server
      containers:
        - name: qbittorrent
          env:
            - name: PGID
              value: "3000"
            - name: PUID
              value: "3000"
          image: harbor.yanello.net/lscr/linuxserver/qbittorrent:5.1.4-r2-ls443@sha256:3ee43a4d08ce4a0108e4c8150f570544a8c4a4a11e2ca95b86d46006547f80d5
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "8Gi"
              cpu: 50m
            limits:
              memory: "12Gi"
          ports:
            - name: qbit-webui
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - mountPath: /config
              name: data
            - mountPath: /data/media/torrents
              name: torrents
      initContainers:
        - name: gluetun
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          image: ghcr.io/qdm12/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "(ip rule del table 51820; ip -6 rule del\
                      \ table 51820) || true"]
          ports:
            - name: http-proxy
              containerPort: 8888
              protocol: TCP
            - name: tcp-shadowsocks
              containerPort: 8388
              protocol: TCP
            - name: udp-shadowsocks
              containerPort: 8388
              protocol: UDP
            - name: qbit-http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: vpn-secrets
          env:
            - name: TZ
              value: "America/Chicago"
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            - name: VPN_SERVICE_PROVIDER
              value: custom
            - name: VPN_TYPE
              value: wireguard
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: VPN_PORT_FORWARDING_PROVIDER
              value: protonvpn
            - name: FIREWALL_DEBUG
              value: "on"
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: /bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}"
                http://localhost:8080/api/v2/app/setPreferences'
            - name: DOT
              value: "off"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          startupProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: torrents
          hostPath:
            path: /data/media/torrents
        - name: data
          persistentVolumeClaim:
            claimName: data
