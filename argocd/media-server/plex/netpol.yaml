---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plex
spec:
  endpointSelector:
    matchLabels:
      app: plex
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
    - fromCIDR:
        - 192.168.0.0/16
        - 10.10.8.0/22
        - 10.42.0.0/16
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
            - port: "3005"
              protocol: TCP
            - port: "8324"
              protocol: TCP
            - port: "32469"
              protocol: TCP
            - port: "1900"
              protocol: UDP
            - port: "5353"
              protocol: UDP
            - port: "32410"
              protocol: UDP
            - port: "32412"
              protocol: UDP
            - port: "32413"
              protocol: UDP
            - port: "32414"
              protocol: UDP
  egress:
    - toCIDR:
        - 192.168.0.0/16
        - 10.10.8.0/22
      toPorts:
        - ports:
            - port: "32410"
              protocol: UDP
            - port: "32411"
              protocol: UDP
            - port: "32412"
              protocol: UDP
            - port: "32413"
              protocol: UDP
            - port: "32414"
              protocol: UDP
            - port: "1900"
              protocol: UDP
            - port: "5353"
              protocol: UDP
            - port: "32400"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
