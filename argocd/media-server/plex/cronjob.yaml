---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: plex-guide-refresh
  labels:
    app: plex-guide-refresh
spec:
  schedule: "15 */2 * * *" # every 2h
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 7200 # 2h
      template:
        metadata:
          labels:
            app: plex-guide-refresh
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: harbor.yanello.net/docker/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  base="${PLEX_URL}"
                  auth="X-Plex-Token=${PLEX_TOKEN}"

                  echo "triggering Plex EPG guide refresh"
                  curl -fsS -X POST "${base}/butler/RefreshEpgGuides?${auth}" -o /dev/null
                  echo "done"
              env:
                - name: PLEX_URL
                  value: http://plex.plex.svc.cluster.local:32400
              envFrom:
                - secretRef:
                    name: plex-scan-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 10Mi
                limits:
                  memory: 50Mi
