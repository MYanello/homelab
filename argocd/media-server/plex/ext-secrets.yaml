---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plex-scan-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: plex-scan-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: plex/plex-scan-secrets
