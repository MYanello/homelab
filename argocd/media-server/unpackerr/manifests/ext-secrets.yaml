---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: sonarr-api-key
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: sonarr
        property: SONARR__API_KEY
