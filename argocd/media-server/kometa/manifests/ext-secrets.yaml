---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: sonarr-api-key
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: sonarr
        property: SONARR__AUTH__APIKEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: radarr-api-key
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: radarr
        property: RADARR__AUTH__APIKEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kometa-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: kometa-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: kometa/kometa-secrets
