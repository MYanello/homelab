---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: themerr-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: themerr-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: themerr/themerr-secrets
