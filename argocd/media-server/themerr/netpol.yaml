---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: themerr
spec:
  endpointSelector:
    matchLabels:
      app: themerr
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9494"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: jellyfin
            app: jellyfin
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: plex
            app: plex
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
