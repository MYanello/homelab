---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: wrapperr
  name: wrapperr
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: wrapperr
  template:
    metadata:
      labels:
        app: wrapperr
    spec:
      restartPolicy: Always
      containers:
        - image: harbor.yanello.net/ghcr/aunefyren/wrapperr:v3.3.1@sha256:2b2021392ae9b1a6c54a98330bdfe62ec0348d4dcba21a71ddf6b46b8b525653
          imagePullPolicy: IfNotPresent
          name: wrapperr
          ports:
            - containerPort: 8282
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 8282
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8282
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 250Mi
          volumeMounts:
            - mountPath: /app/config
              name: wrapperr-config
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: wrapperr-config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: truenas-hdd-nfs
        resources:
          requests:
            storage: 1Gi
