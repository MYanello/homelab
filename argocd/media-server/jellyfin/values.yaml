---
image:
  repository: harbor.yanello.net/docker/jellyfin/jellyfin
  tag: 12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037

resources:
  limits:
    nvidia.com/gpu: "1"
    memory: 8Gi
  requests:
    nvidia.com/gpu: "1"
    cpu: "500m"
    memory: 500Mi

volumes:
  - name: host-media
    hostPath:
      path: /data/media
volumeMounts:
  - name: host-media
    mountPath: /data/media
runtimeClassName: nvidia

persistence:
  config:
    storageClass: truenas-ssd-nfs
  media:
    storageClass: truenas-hdd-nfs

startupProbe:
  tcpSocket: null
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 30

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - marcus-server
