---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: tracearr-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: tracearr/tracearr-secrets
