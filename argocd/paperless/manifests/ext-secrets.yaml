---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: paperless-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: paperless/paperless-secrets
