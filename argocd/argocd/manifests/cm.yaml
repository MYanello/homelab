---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: argocd
  name: argocd-cm
data:
  admin.enabled: "false"
  kustomize.buildOptions: --enable-helm --enable-alpha-plugins --enable-exec
  controller.diff.server.side: "true"
  webhook.github.secret: $argocd-custom-secrets:webhook.github.secret
  url: https://argocd.yanello.net
  resource.links: |
    - url: https://{{index .resource.spec.hostnames 0}}
      title: Resource
      if: resource.kind == "HTTPRoute" || resource.kind == "TLSRoute"
  oidc.config: |
    name: Authentik
    issuer: https://authentik.yanello.net/application/o/argocd/
    clientID: $argocd-custom-secrets:oidc.authentik.clientId
    clientSecret: $argocd-custom-secrets:oidc.authentik.clientSecret

    skipAudienceCheckWhenTokenHasNoAudience: false
    requestedScopes: ["openid", "profile", "email", "groups"]

    requestedIDTokenClaims: {"groups": {"essential": true}}

    enablePKCEAuthentication: true

    refreshTokenThreshold: 30s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.csv: |-
    g, admin, role:admin
    p, role:read-only-role, applications, *, */*, allow
    p, role:read-only-role, clusters, get, *, allow
    p, role:read-only-role, repositories, get, *, allow
    p, role:read-only-role, projects, get, *, allow
    p, role:read-only-role, logs, get, *, allow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
data:
  server.insecure: "true"
