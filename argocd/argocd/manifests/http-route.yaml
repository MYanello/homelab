---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: ArgoCD
    gethomepage.dev/icon: sh-argo-cd
    gethomepage.dev/description: "Argo CD is a declarative, GitOps continuous delivery\
      \ tool for Kubernetes."
    gethomepage.dev/pod-selector: app.kubernetes.io/name=argocd-server
  labels:
    app.kubernetes.io/instance: argocd-app
  name: argocd-route
spec:
  parentRefs:
    - name: cilium-public-gateway
      namespace: cilium
      sectionName: https
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - argocd.yanello.net
  rules:
    - backendRefs:
        - name: argocd-server
          group: ""
          kind: Service
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/instance: argocd-app
  name: argocd-public-route
spec:
  parentRefs:
    - name: cilium-public-gateway
      namespace: cilium
      sectionName: https
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - argocd.yanello.net
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/webhook
          method: POST
      backendRefs:
        - name: argocd-server
          port: 80
