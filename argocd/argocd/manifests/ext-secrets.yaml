---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-custom-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: argocd-custom-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  dataFrom:
    - extract:
        key: argocd/argocd-custom-secrets
