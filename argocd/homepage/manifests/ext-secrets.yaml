---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: home-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: homepage/home-secrets
