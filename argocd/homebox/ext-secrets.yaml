---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hbox-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: hbox-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: homebox/hbox-secrets
