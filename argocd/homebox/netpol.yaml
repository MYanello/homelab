---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homebox
spec:
  endpointSelector:
    matchLabels:
      app: homebox
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cilium
            k8s-app: cilium-envoy
      toPorts:
        - ports:
            - port: "7745"
              protocol: TCP
  egress:
    - toFQDNs:
        - matchName: authentik.yanello.net
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
