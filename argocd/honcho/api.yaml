---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: honcho-api
  template:
    metadata:
      labels:
        app: honcho-api
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        - name: db-migrate
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          image: harbor.yanello.net/ghcr/plastic-labs/honcho:v3.7.0@sha256:c504f51e124ee225634251b3c99cdb324667d0e7355982dad0cc7a9fb75d8b81
          imagePullPolicy: Always
          command: ["/app/.venv/bin/python", "scripts/provision_db.py"]
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-superuser
                  key: user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-superuser
                  key: password
            - name: DB_CONNECTION_URI
              value: "postgresql+psycopg://$(DB_USER):$(DB_PASS)@db-rw.honcho.svc.cluster.local:5432/postgres"
          envFrom:
            - secretRef:
                name: honcho-env
      containers:
        - name: api
          image: harbor.yanello.net/ghcr/plastic-labs/honcho:v3.7.0@sha256:c504f51e124ee225634251b3c99cdb324667d0e7355982dad0cc7a9fb75d8b81
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-superuser
                  key: user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-superuser
                  key: password
            - name: DB_CONNECTION_URI
              value: "postgresql+psycopg://$(DB_USER):$(DB_PASS)@db-rw.honcho.svc.cluster.local:5432/postgres"
          envFrom:
            - secretRef:
                name: honcho-env
            - configMapRef:
                name: honcho-config
          resources:
            requests:
              cpu: 20m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: honcho-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: honcho-api
