---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deriver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: honcho-deriver
  template:
    metadata:
      labels:
        app: honcho-deriver
    spec:
      initContainers:
        - name: db-migrate
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          image: harbor.yanello.net/library/honcho:v3.0.12@sha256:19d0f1bf5b184969ffeee41ddd69cff5a88f528eeda9a82b46e76708a3ba1e0b
          command: ["/app/.venv/bin/python", "scripts/provision_db.py"]
          envFrom:
            - secretRef:
                name: honcho-env
      containers:
        - name: deriver
          image: harbor.yanello.net/library/honcho:v3.0.12@sha256:19d0f1bf5b184969ffeee41ddd69cff5a88f528eeda9a82b46e76708a3ba1e0b
          imagePullPolicy: Always
          command: ["/app/.venv/bin/python", "-m", "src.deriver"]
          envFrom:
            - secretRef:
                name: honcho-env
            - configMapRef:
                name: honcho-config
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 512Mi
