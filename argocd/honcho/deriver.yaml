---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deriver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: honcho-deriver
  template:
    metadata:
      labels:
        app: honcho-deriver
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        - name: db-migrate
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          image: harbor.yanello.net/ghcr/plastic-labs/honcho:v3.7.0@sha256:e663b958d28c4b05dfeabd9f5bfd96120e9a60dcf13bf8da308be4368d6275c3
          command: ["/app/.venv/bin/python", "scripts/provision_db.py"]
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-superuser
                  key: user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-superuser
                  key: password
            - name: DB_CONNECTION_URI
              value: "postgresql+psycopg://$(DB_USER):$(DB_PASS)@db-rw.honcho.svc.cluster.local:5432/postgres"
          envFrom:
            - secretRef:
                name: honcho-env
      containers:
        - name: deriver
          image: harbor.yanello.net/ghcr/plastic-labs/honcho:v3.7.0@sha256:e663b958d28c4b05dfeabd9f5bfd96120e9a60dcf13bf8da308be4368d6275c3
          imagePullPolicy: Always
          command: ["/app/.venv/bin/python", "-m", "src.deriver"]
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-superuser
                  key: user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-superuser
                  key: password
            - name: DB_CONNECTION_URI
              value: "postgresql+psycopg://$(DB_USER):$(DB_PASS)@db-rw.honcho.svc.cluster.local:5432/postgres"
          envFrom:
            - secretRef:
                name: honcho-env
            - configMapRef:
                name: honcho-config
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 512Mi
