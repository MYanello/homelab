---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: chat-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: open-webui/chat-secrets
