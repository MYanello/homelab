---
# https://docker-minecraft-server.readthedocs.io/en/latest/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - netpol.yaml
  - ./manifests/sts.yaml
  - ./manifests/svc.yaml
  - ./manifests/route.yaml

configMapGenerator:
  - name: mc-config
    envs:
      - ./manifests/cm.env

generators:
  - ./manifests/secret-generator.yaml
