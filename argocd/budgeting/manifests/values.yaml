---
image:
  tag: v1.19.3
  pullPolicy: Always
replicaCount: 0

rollout:
  enabled: false
  revisionHistoryLimit: 2
  strategy:
    blueGreen:
      activeService: budgeting
      previewService: budgeting-preview
      autoPromotionEnabled: false

config:
  db:
    driver: postgres
    host: db-rw
    port: "5432"
    name: budgeting
    existingSecret: db-app
    existingSecretUserKey: user
    existingSecretPasswordKey: password

oidc:
  enabled: true
  issuer: "https://authentik.yanello.net/application/o/budgeting/"
  redirectUrl: "https://budgeting.yanello.net/auth/callback"
  existingSecret: "budgeting-secrets"
  existingSecretClientIdKey: "OIDC_CLIENT_ID"
  existingSecretClientSecretKey: "OIDC_CLIENT_SECRET"

resources:
  requests:
    cpu: 10m
    memory: 10Mi
  limits:
    memory: 25Mi
