---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: budgeting-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: budgeting-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: budgeting/budgeting-secrets
