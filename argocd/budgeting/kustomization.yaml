---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generators:
  - secret-generator.yaml

resources:
  - ./netpol.yaml
  - ./cnpg.yaml
  - ./httproute.yaml

helmCharts:
  - name: budgeting
    repo: oci://harbor.yanello.net/helm
    version: 1.19.3
    releaseName: budgeting
    namespace: budgeting
    valuesFile: ./values.yaml

replicas:
  - name: budgeting
    count: 0
