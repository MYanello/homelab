---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: budgeting
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: "harbor.yanello.net/helm"
      chart: "budgeting"
      targetRevision: "0.2.3"
      helm:
        releaseName: "budgeting"
        valueFiles:
          - "$values/argocd/budgeting/manifests/values.yaml"
    - repoURL: "https://github.com/myanello/homelab"
      targetRevision: "main"
      ref: "values"
    - repoURL: "https://github.com/myanello/homelab"
      path: "argocd/budgeting/manifests"
      targetRevision: "main"
  destination:
    name: in-cluster
    namespace: budgeting
  ignoreDifferences:
    - group: ""
      kind: Service
      jqPathExpressions:
        - .spec.selector
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .status
        - .spec.parentRefs[].group
        - .spec.parentRefs[].kind
        - .spec.rules[].backendRefs[].group
        - .spec.rules[].backendRefs[].kind
        - .spec.rules[].backendRefs[].weight
        - .spec.rules[].matches
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
