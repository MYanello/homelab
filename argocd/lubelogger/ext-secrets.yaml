---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lube-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: lube-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: lubelogger/lube-secrets
