---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lubelogger
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lubelogger
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toCIDR:
        - 10.10.8.0/22
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "587"
              protocol: TCP
            - port: "465"
              protocol: TCP
