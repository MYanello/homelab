---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lubelogger
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lubelogger
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cilium
            k8s-app: cilium-envoy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "587"
              protocol: TCP
            - port: "465"
              protocol: TCP
