---
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-benchmark
  namespace: vllm
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: vllm-bench
          image: harbor.yanello.net/docker/vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
          command:
            - /bin/sh
            - -c
            - |
              vllm bench serve \
                --backend openai \
                --base-url https://sglang.cw623e-myanello.coreweave.app \
                --num-prompts 200 \
                --input-len 1024 \
                --output-len 512 \
                --request-rate inf \
                --max-concurrency 2 \
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-key
                  key: api-key
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
