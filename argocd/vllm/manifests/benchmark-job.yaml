---
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-benchmark
  namespace: vllm
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: vllm-bench
          image: harbor.yanello.net/docker/vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
          command:
            - /bin/sh
            - -c
            - |
              vllm bench serve \
                --backend openai \
                --base-url https://sglang.cw623e-myanello.coreweave.app \
                --model inference/latest \
                --tokenizer audnai/penclaw-GLM-5.3-abliterated \
                --num-prompts 200 \
                --input-len 1024 \
                --output-len 512 \
                --request-rate inf \
                --max-concurrency 2 \
                --dataset-name spec_bench --spec-bench-output-len 512 --spec-bench-category coding
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-key
                  key: api-key
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
