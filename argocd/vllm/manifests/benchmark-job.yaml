---
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-benchmark
  namespace: vllm
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: vllm-bench
          image: harbor.yanello.net/docker/vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
          command:
            - /bin/sh
            - -c
            - |
              vllm bench serve \
                --backend openai \
                --base-url https://vllm.cw623e-myanello.coreweave.app \
                --model deepseek-ai/DeepSeek-V4.1-Flash \
                --tokenizer deepseek-ai/DeepSeek-V4.1-Flash \
                --num-prompts 200 \
                --input-len 1024 \
                --output-len 512 \
                --request-rate inf \
                --max-concurrency 8 \
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-key
                  key: api-key
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
